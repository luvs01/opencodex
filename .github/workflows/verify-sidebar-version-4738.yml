name: Verify sidebar version PR 4738

on:
  push:
    branches: [verify/sidebar-version-4738-20260916]
    paths: [.github/workflows/verify-sidebar-version-4738.yml]

permissions:
  contents: read

concurrency:
  group: verify-sidebar-version-4738
  cancel-in-progress: false

jobs:
  gui-validation:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 3aa81f5e7b5fe54c36440fc1c75ef1599987319d
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 3aa81f5e7b5fe54c36440fc1c75ef1599987319d
          fetch-depth: 4
          persist-credentials: false
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
          mkdir -p .tmp/pr4738-evidence
          {
            echo "source_sha=$TARGET_SHA"
            echo "workflow_sha=$GITHUB_SHA"
            echo "bun=$(bun --version)"
            echo "node=$(node --version)"
            uname -a
            sha256sum package.json bun.lock gui/package.json gui/bun.lock
          } > .tmp/pr4738-evidence/environment.txt
      - name: GUI tests (documented command)
        if: ${{ !cancelled() }}
        working-directory: gui
        run: |
          set -o pipefail
          bun test tests 2>&1 | tee ../.tmp/pr4738-evidence/gui-tests.log
      - name: GUI lint
        if: ${{ !cancelled() }}
        working-directory: gui
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee ../.tmp/pr4738-evidence/gui-lint.log
      - name: GUI production build and TypeScript
        if: ${{ !cancelled() }}
        working-directory: gui
        run: |
          set -o pipefail
          bun run build 2>&1 | tee ../.tmp/pr4738-evidence/gui-build.log
      - name: Built CSS browser geometry (128 cases)
        if: ${{ !cancelled() }}
        working-directory: gui
        run: |
          set -o pipefail
          bun run test:sidebar-version ../.tmp/pr4738-evidence/browser 2>&1 | tee ../.tmp/pr4738-evidence/browser.log
      - name: Root TypeScript
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee .tmp/pr4738-evidence/root-typecheck.log
      - name: React Doctor against PR base
        if: ${{ !cancelled() }}
        working-directory: gui
        run: |
          set -o pipefail
          npx --yes react-doctor@0.9.11 --verbose --scope changed --base 3070d64d8822c6d8c62989665f82ab665e4d164c --no-telemetry 2>&1 | tee ../.tmp/pr4738-evidence/react-doctor.log
      - name: Privacy scan
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bun run privacy:scan 2>&1 | tee .tmp/pr4738-evidence/privacy.log
      - name: Upload exact-head validation logs and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr4738-validation-logs
          path: .tmp/pr4738-evidence/
          retention-days: 7
          if-no-files-found: error
