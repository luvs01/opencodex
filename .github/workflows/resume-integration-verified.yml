name: Verified author conflict resolutions
on:
  push:
    branches: [automation/pr-resume-20260927]
    paths: [.github/workflows/resume-integration-verified.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidates: ${{ steps.publish.outputs.candidates }}
    steps:
      - name: Apply the reviewed integration corrections to the pinned preparation
        run: |
          python3 - <<'PY'
          import urllib.request,subprocess,yaml
          url='https://raw.githubusercontent.com/luvs01/opencodex/ef8f1f0a895a996ad735ac62f70ea91396b529b1/.github/workflows/resume-current-integration.yml'
          with urllib.request.urlopen(url,timeout=30) as r: data=yaml.safe_load(r.read())
          script=data['jobs']['prepare']['steps'][0]['run']
          def change(old,new):
              global script
              assert script.count(old)==1,(old,script.count(old));script=script.replace(old,new)
          change("import json,os,pathlib,subprocess,tempfile,urllib.request", "import json,os,pathlib,subprocess,tempfile,urllib.request,re")
          change("    subprocess.run(['git','-C',str(cwd),'merge','--no-commit','--no-ff',base],capture_output=True,text=True)","    if n != 6043: subprocess.run(['git','-C',str(cwd),'merge','--no-commit','--no-ff',base],capture_output=True,text=True)")
          change("    allowed={'scripts/test-layout/layout.json','tests/fixtures/test-layout-expected.json'}", "    allowed={'scripts/test-layout/layout.json','tests/fixtures/test-layout-expected.json'} | ({'src/update/job.ts'} if n==6037 else set())")
          change("        for name in conflicts:\n            versions=",'''        for name in conflicts:
                      if name=='src/update/job.ts':
                          p=cwd/name; text=p.read_text()
                          pattern=r'<<<<<<< HEAD\nimport type \{ WorkerLaunchContext \} from "\./worker-launch";\n=======\nimport \{ withoutSiblingMarker \} from "\.\./codex/sibling-start";\n>>>>>>> [a-f0-9]+\n'
                          replacement='import type { WorkerLaunchContext } from "./worker-launch";\\nimport { withoutSiblingMarker } from "../codex/sibling-start";\\n'
                          text,count=re.subn(pattern,replacement,text)
                          assert count==1 and '<<<<<<<' not in text
                          p.write_text(text);git(cwd,'add',name);continue
                      versions=''' )
          old='''            with tempfile.TemporaryDirectory() as tmp:
                          paths=[]
                          for i,s in enumerate(versions):
                              p=pathlib.Path(tmp)/str(i);p.write_text(s);paths.append(str(p))
                          union=subprocess.check_output(['git','merge-file','--stdout','--union',paths[1],paths[0],paths[2]],text=True)
                      assert json.loads(union,object_pairs_hook=unique)==expected
                      (cwd/name).write_text(union);git(cwd,'add',name)'''
          new='''            incoming=json.loads(versions[2]); nested=name.endswith('/layout.json')
                      expected_table=expected['explicit'] if nested else expected
                      incoming_table=incoming['explicit'] if nested else incoming
                      additions={k:v for k,v in expected_table.items() if k not in incoming_table}
                      assert 0 < len(additions) <= 10
                      assert all(k.endswith('.test.ts') and isinstance(v,str) for k,v in additions.items())
                      assert all(expected_table.get(k)==v for k,v in incoming_table.items())
                      if nested:
                          assert {k:v for k,v in expected.items() if k!='explicit'}=={k:v for k,v in incoming.items() if k!='explicit'}
                      text=versions[2]; pattern=r'("explicit"\\s*:\\s*\\{\\n)' if nested else r'^(\\{\\n)'
                      indent='    ' if nested else '  '
                      inserted=''.join(indent+json.dumps(k)+': '+json.dumps(v)+',\\n' for k,v in sorted(additions.items()))
                      text,count=re.subn(pattern,lambda match:match.group(1)+inserted,text,count=1)
                      assert count==1 and json.loads(text,object_pairs_hook=unique)==expected
                      (cwd/name).write_text(text);git(cwd,'add',name)'''
          change(old,new)
          change("        git(cwd,'diff','--cached','--check',base)","        git(cwd,'diff','--cached','--check',sha if n==6043 else base)")
          change("        git(cwd,'merge-base','--is-ancestor',sha,'HEAD');git(cwd,'merge-base','--is-ancestor',base,'HEAD')", "        git(cwd,'merge-base','--is-ancestor',sha,'HEAD')\n        if n != 6043: git(cwd,'merge-base','--is-ancestor',base,'HEAD')")
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Publish isolated candidates only
        id: publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)";echo "::add-mask::$auth"
          export PUSH_HEADER="AUTHORIZATION: basic $auth"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'integrate';data=json.loads((root/'candidates.json').read_text())
          for row in data['include']:
              subprocess.run(['git','-C',str(root/row['pr']),'-c','http.https://github.com/.extraheader='+os.environ['PUSH_HEADER'],'push','https://github.com/luvs01/opencodex','HEAD:refs/heads/automation/resume-verified-pr'+row['pr']+'-20260927'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('candidates='+json.dumps(data)+'\n')
          PY
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.candidates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Run focused native files
        env:
          TEST_FILES: ${{ toJSON(matrix.tests) }}
        run: python3 -c 'import json,os,subprocess;subprocess.run(["bun","test",*json.loads(os.environ["TEST_FILES"])],check=True)'
      - run: bun run typecheck
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun test tests/ci-workflows/file-size-ratchet.test.ts tests/test-layout.test.ts tests/test-layout-tooling.test.ts
      - run: git diff --exit-code
