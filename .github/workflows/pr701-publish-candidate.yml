name: PR701 exact tested candidate
on:
  push:
    branches: [codex/pr701-offline-workspace-20261004]
    paths: [.github/workflows/pr701-publish-candidate.yml]
permissions:
  contents: read
jobs:
  publish-candidate:
    if: github.repository == 'luvs01/opencodex' && github.ref == 'refs/heads/codex/pr701-offline-workspace-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # No dependency install, repository script, test, or changed source executes with this token.
      # Only the fixed patch checksum and full tested tree may be published to a NEW candidate ref.
      - name: Reconstruct exact tested tree without running patched code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, subprocess, tempfile
          from pathlib import Path
          base = 'b53208945af7e21ec5627ef8b99e8eb9d8eb4309'
          expected_tree = '09245300f28082c32db13d3a20a9d2f5fdc343e1'
          branch = 'codex/pr701-tested-candidate-20261004'
          if os.environ['GITHUB_REPOSITORY'] != 'luvs01/opencodex':
              raise RuntimeError('wrong repository')
          encoded = ''.join(Path('scripts/pr701-transfer/fix.part' + str(i)).read_text().strip() for i in (1, 2))
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=100_000)
          if not decoder.eof or decoder.unused_data or len(patch) != 50896:
              raise RuntimeError('invalid patch envelope')
          if hashlib.sha256(patch).hexdigest() != 'a3f054a0219b125c332a2cf27160489d8a8cbb4d1455f1d191eb9f89d00a14cc':
              raise RuntimeError('patch checksum mismatch')
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode(),
              GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]',
              GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          def git(*args, data=None):
              result = subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env, check=True)
              return result.stdout.decode().strip()
          if git('remote', 'get-url', 'origin') not in ('https://github.com/luvs01/opencodex', 'https://github.com/luvs01/opencodex.git'):
              raise RuntimeError('unexpected remote')
          if git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch):
              raise RuntimeError('candidate branch already exists; no overwrite')
          git('fetch', '--no-tags', '--depth=1', 'origin', base)
          git('checkout', '--detach', base)
          git('apply', '--index', '--check', '--whitespace=error-all', '-', data=patch)
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          git('diff', '--cached', '--check')
          tree = git('write-tree')
          if tree != expected_tree:
              raise RuntimeError('full tree differs from locally verified source')
          paths = git('diff', '--cached', '--name-only').splitlines()
          if len(paths) != 14 or any(not p.startswith(('src/', 'tests/', 'structure/', 'docs-site/')) for p in paths):
              raise RuntimeError('unexpected changed-file scope')
          message = ('fix(gui): require one-use local write intent without a server terminal\n\n'
              'Retain the existing gui pair command and background-server operation.\n'
              'Bind an in-memory random verifier to an owner-written, single-use disk\n'
              'commitment and the existing process/origin/expiry capability.\n'
              'This is configuration-write authority, not proof of human presence.\n\n'
              'Verified on Linux with Bun 1.4.0: 208 focused tests passed, including\n'
              'real headless CLI/server HTTP admission. Removing the intent check\n'
              'makes the runtime-secret-only negative control fail (201 vs 403).\n'
              'Typecheck, privacy, structure and diff checks passed. Native platforms\n'
              'and full SSH enrollment remain unverified. No merge or release.\n\n'
              'Co-authored-by: Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>\n')
          commit = git('commit-tree', tree, '-p', base, data=message.encode())
          git('push', 'origin', commit + ':refs/heads/' + branch)
          print('CANDIDATE_COMMIT=' + commit)
          print('TESTED_TREE=' + tree)
          print('CHANGED_FILES=' + str(len(paths)))
          PY
