name: PR 4739 verified full-run evidence and baseline

on:
  push:
    branches: [verify/pr4739-bun-20260916]
    paths: [.github/workflows/pr4739-failure-baseline.yml]

permissions:
  contents: read
  actions: read

# Fork-only, exact-source evidence. No workflow or test change enters PR 4739.
jobs:
  compare:
    if: github.repository == 'luvs01/opencodex'
    name: observed sandbox failure / ${{ matrix.ref.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        ref:
          - name: base
            sha: 3070d64d8822c6d8c62989665f82ab665e4d164c
          - name: head
            sha: 469e7ab21689d5cf938ea9cf85ef36f9ff977572
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact ancestry
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: luvs01/opencodex
          ref: 469e7ab21689d5cf938ea9cf85ef36f9ff977572
          fetch-depth: 2
          persist-credentials: false
      - name: Read exact original job identity and archived output
        if: matrix.ref.name == 'head'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for endpoint in '' '/logs'; do
            suffix=metadata.json
            if [ "$endpoint" = '/logs' ]; then suffix=full.log; fi
            curl --fail --silent --show-error --location --max-time 60 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/luvs01/opencodex/actions/jobs/104636205018${endpoint}" \
              --output "$RUNNER_TEMP/pr4739-${suffix}"
          done
      - name: Verify provenance and print exact original summaries
        if: matrix.ref.name == 'head'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const job = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'pr4739-metadata.json'), 'utf8'));
          if (job.id !== 104636205018 || job.run_id !== 35046125837 || job.name !== 'native Bun / full-suite') throw new Error('Original job identity mismatch');
          const bytes = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'pr4739-full.log'));
          const raw = bytes.toString('utf8');
          if (!raw.includes('469e7ab21689d5cf938ea9cf85ef36f9ff977572')) throw new Error('Missing product source attestation');
          const text = raw.replace(/\u001b\[[0-9;]*m/g, '').replace(/^\ufeff/, '').replace(/^\d{4}-\d\d-\d\dT\S+ /gm, '');
          console.log('ORIGINAL_JOB', JSON.stringify({id:job.id,run_id:job.run_id,name:job.name,status:job.status,conclusion:job.conclusion,workflow_sha:job.head_sha,logBytes:bytes.length,logSha256:crypto.createHash('sha256').update(bytes).digest('hex')}));
          const lines = text.split('\n');
          console.log('ORIGINAL_TOP_LEVEL_SUMMARIES');
          for (const line of lines) if (/^\s*\d+ (pass|skip|fail)\s*$/.test(line) || /^Ran \d+ tests? across/.test(line) || /^\[test\].*finished/.test(line) || /^bun test v/.test(line)) console.log(line);
          const failures = [...new Set(lines.filter(line=>line.startsWith('(fail) ')).map(line=>line.replace(/\s+\[[^\]]+\]$/, '')))];
          console.log('ORIGINAL_UNIQUE_FAILURES', JSON.stringify(failures));
          const indices = new Set();
          for (let n=0;n<lines.length;n++) if (lines[n].startsWith('(fail) ')) for(let k=Math.max(0,n-24);k<=Math.min(lines.length-1,n+2);k++) indices.add(k);
          console.log('ORIGINAL_FAILURE_CONTEXT\n'+[...indices].sort((a,b)=>a-b).map(k=>lines[k]).join('\n').slice(0,18000));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Original run identity verified: job 104636205018 / run 35046125837, exact product 469e7ab. The archived raw log, not an earlier external rendering, is authoritative for counts.\n\nUnique failure names: '+JSON.stringify(failures)+'\n');
          NODE
      - name: Select ref and sandbox user homes
        env:
          PRODUCT_SHA: ${{ matrix.ref.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          file=tests/clients/remote-workspace-command-runner.test.ts
          test "$(git rev-parse 3070d64d8822c6d8c62989665f82ab665e4d164c:$file)" = "$(git rev-parse 469e7ab21689d5cf938ea9cf85ef36f9ff977572:$file)"
          root="$RUNNER_TEMP/pr4739-observed"
          mkdir -p "$root/home" "$root/opencodex" "$root/codex"
          printf 'HOME=%s\nUSERPROFILE=%s\nOPENCODEX_HOME=%s\nCODEX_HOME=%s\n' "$root/home" "$root/home" "$root/opencodex" "$root/codex" >> "$GITHUB_ENV"
      - name: Setup pinned project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install frozen root dependencies
        run: bun install --frozen-lockfile
      - name: Reproduce the actual failed file once without editing source or tests
        env:
          PRODUCT_SHA: ${{ matrix.ref.sha }}
          PRODUCT_LABEL: ${{ matrix.ref.name }}
          NO_COLOR: '1'
        run: |
          set +e
          bun test tests/clients/remote-workspace-command-runner.test.ts > "$RUNNER_TEMP/pr4739-sandbox.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/pr4739-sandbox.log"
          printf 'Ref `%s` (%s): native original sandbox file exit %s. This is a baseline diagnostic, not a green full-suite claim.\n' "$PRODUCT_SHA" "$PRODUCT_LABEL" "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Verify product source is unchanged
        if: always() && !cancelled()
        run: git diff --exit-code HEAD
