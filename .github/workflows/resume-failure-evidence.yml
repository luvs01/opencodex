name: Current-head failure evidence
on:
  push:
    branches: [automation/pr-resume-20260927]
    paths: [.github/workflows/resume-failure-evidence.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded failure evidence without repository execution
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.parse
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if urllib.parse.urlsplit(newurl).scheme != 'https': raise RuntimeError('Non-HTTPS redirect refused')
                  if urllib.parse.urlsplit(req.full_url).hostname != urllib.parse.urlsplit(newurl).hostname:
                      result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(SafeRedirect)
          jobs=[108559029939,108559029993,108559029925,108551489105,108551567206,108563056156]
          for job in jobs:
              print('BEGIN_JOB',job,flush=True)
              req=urllib.request.Request(f'https://api.github.com/repos/lidge-jun/opencodex/actions/jobs/{job}/logs',headers={'Authorization':'Bearer '+os.environ['API_TOKEN'],'User-Agent':'author-failure-evidence'})
              if job==108563056156: req.full_url=f'https://api.github.com/repos/luvs01/opencodex/actions/jobs/{job}/logs'
              try:
                  with opener.open(req,timeout=45) as r: text=r.read(35_000_000).decode('utf-8','replace')
                  lines=text.splitlines(); selected=set()
                  for i,line in enumerate(lines):
                      if re.search(r'\(fail\)|##\[error\]|error TS|missing_coauthor|^.* Error:|AssertionError|Expected:|Received:|SSOT.*failed|exceeds.*lines|transient-secret.*FAIL|\d+ pass|\d+ fail',line) and '\x1b[36;1m' not in line:
                          selected.update(range(max(0,i-3),min(len(lines),i+9)))
                  out='\n'.join(lines[i] for i in sorted(selected))
                  print(out[:23000]); print('END_JOB',job,'selected_chars',len(out))
              except Exception as e: print('READ_FAILED',type(e).__name__,str(e))
          PY
