name: PR701 tested cleanup candidate
on:
  push:
    branches: [codex/pr701-offline-workspace-20261004]
    paths: [.github/workflows/pr701-followup-candidate-20261005.yml]
permissions:
  contents: read
jobs:
  publish-candidate:
    if: github.repository == 'luvs01/opencodex' && github.ref == 'refs/heads/codex/pr701-offline-workspace-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # Transport data only: no dependency install, repository script or patched source executes.
      # Publish only a NEW candidate ref; updating the PR requires a separate expected-head lease.
      - name: Reconstruct the exact locally tested three-file tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, subprocess, zlib
          from pathlib import Path
          base = 'ce54c457edfac838e82ef97bf82b7f4ac6be63c4'
          expected_tree = '5e58fced47d371ff0ad704d9778076c9fdec1a10'
          branch = 'codex/pr701-cleanup-budget-20261005'
          expected_paths = {'src/lib/gui-pair-intent.ts', 'tests/gui/gui-pair-delivery.test.ts', 'structure/gui-and-management-api.md'}
          if os.environ['GITHUB_REPOSITORY'] != 'luvs01/opencodex' or os.environ['GITHUB_REF'] != 'refs/heads/codex/pr701-offline-workspace-20261004':
              raise RuntimeError('wrong repository or ref')
          encoded = Path('scripts/pr701-followup-20261005/fix.b64').read_bytes()
          if len(encoded) > 10000:
              raise RuntimeError('oversized transport data')
          decoder = zlib.decompressobj()
          patch = decoder.decompress(base64.b64decode(encoded.strip(), validate=True), 10001)
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(patch) != 6704:
              raise RuntimeError('invalid patch envelope')
          if hashlib.sha256(patch).hexdigest() != '4c20994948eb9be8e034765e263ca596b110efb80bc2401c751d490ff10c3d6b':
              raise RuntimeError('patch checksum mismatch')
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode(),
              GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]',
              GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          def git(*args, data=None):
              result = subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env, check=True)
              return result.stdout.decode().strip()
          if git('remote', 'get-url', 'origin') not in ('https://github.com/luvs01/opencodex', 'https://github.com/luvs01/opencodex.git'):
              raise RuntimeError('unexpected remote')
          if git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch):
              raise RuntimeError('candidate exists; refusing overwrite')
          git('fetch', '--no-tags', '--depth=1', 'origin', base)
          git('checkout', '--detach', base)
          git('apply', '--index', '--check', '--whitespace=error-all', '-', data=patch)
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          git('diff', '--cached', '--check')
          tree = git('write-tree')
          if tree != expected_tree:
              raise RuntimeError('tree differs from tested source')
          if set(git('diff', '--cached', '--name-only').splitlines()) != expected_paths:
              raise RuntimeError('unexpected changed-file scope')
          message = ('fix(gui): bound stale pairing-intent cleanup work\n\n'
              'Inspect at most 256 entries per command, including foreign and fresh entries.\n'
              'Preserve one-use intent, origin, owner and replacement checks. This caps\n'
              'per-entry metadata/deletion work, not enumeration memory or syscall duration.\n\n'
              'Linux/Bun 1.4.0: two new regressions fail before the source fix;\n'
              '212 focused tests pass afterwards. Typecheck, privacy, structure and\n'
              'whitespace checks pass on the complete published tree. Native platforms,\n'
              'full SSH enrollment and the full repository suite were not run.\n\n'
              'Co-authored-by: Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>\n')
          commit = git('commit-tree', tree, '-p', base, data=message.encode())
          git('push', 'origin', commit + ':refs/heads/' + branch)
          print('CANDIDATE_COMMIT=' + commit)
          print('TESTED_TREE=' + tree)
          PY
