name: PR 4739 native Bun verification

on:
  push:
    branches: [verify/pr4739-bun-20260916]
    paths: [.github/workflows/pr4739-native-verification.yml]

permissions:
  contents: read

concurrency:
  group: pr4739-native-verification
  cancel-in-progress: false

# Fork-only validation infrastructure. Never merged into the product PR.
# No secrets, write token, self-hosted runner, dynamic ref, or publish step.
# The checkout is the exact product commit, NOT this workflow-bearing commit.
jobs:
  verify:
    if: github.repository == 'luvs01/opencodex'
    name: native Bun / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [focused-and-gates, full-suite]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: luvs01/opencodex
          ref: 469e7ab21689d5cf938ea9cf85ef36f9ff977572
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate homes and attest source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 469e7ab21689d5cf938ea9cf85ef36f9ff977572
          root="$RUNNER_TEMP/pr4739-homes"
          mkdir -p "$root/home" "$root/opencodex" "$root/codex" "$root/config" "$root/state"
          printf 'HOME=%s\nOPENCODEX_HOME=%s\nCODEX_HOME=%s\nXDG_CONFIG_HOME=%s\nXDG_STATE_HOME=%s\n' \
            "$root/home" "$root/opencodex" "$root/codex" "$root/config" "$root/state" >> "$GITHUB_ENV"
          git diff --check 3070d64d8822c6d8c62989665f82ab665e4d164c HEAD
          git diff --stat 3070d64d8822c6d8c62989665f82ab665e4d164c HEAD
          printf 'Product head: `%s`\n\nSource tree: `%s`\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pinned project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Install exact root and dashboard dependencies
        run: |
          set -euo pipefail
          bun --version
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
          git diff --exit-code -- package.json bun.lock gui/package.json gui/bun.lock

      - name: Native terminal-guard focused and integration tests
        if: matrix.lane == 'focused-and-gates'
        run: |
          set -euo pipefail
          mapfile -t tests < <(git ls-files 'tests/*terminal-guard*.test.ts' 'tests/*/*terminal-guard*.test.ts' 'tests/*/*/*terminal-guard*.test.ts' | sort -u)
          test "${#tests[@]}" -gt 0
          printf '%s\n' "${tests[@]}"
          bun test "${tests[@]}"

      - name: Repository typecheck
        if: always() && matrix.lane == 'focused-and-gates' && !cancelled()
        run: bun run typecheck

      - name: Privacy scan
        if: always() && matrix.lane == 'focused-and-gates' && !cancelled()
        run: bun run privacy:scan

      - name: Structure ownership and documentation check
        if: always() && matrix.lane == 'focused-and-gates' && !cancelled()
        run: bun run structure:check

      - name: Build dashboard required by repository integration tests
        if: matrix.lane == 'full-suite'
        run: cd gui && bun run build

      - name: Full native repository suite
        if: matrix.lane == 'full-suite'
        run: bun run test

      - name: Confirm tracked product files were not changed by validation
        if: always() && !cancelled()
        run: git diff --exit-code HEAD
