name: Author systemd exact candidate validation
on:
  push:
    branches: [automation/pr-author-audit-20260927]
    paths: [.github/workflows/pr-author-systemd-final-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 8a2ad7b1370325a7722e0dc5ec8a4e7988d6c927
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Locate and execute actual focused update callers
        run: |
          set -euo pipefail
          mapfile -t callers < <(git grep -l 'startUpdateJob' -- 'tests/*.ts' 'tests/**/*.ts')
          test "${#callers[@]}" -gt 0
          printf 'TRACKED_CALLER_TEST %s\n' "${callers[@]}"
          for file in tests/update/update-worker-launch.test.ts "${callers[@]}"; do
            echo "TEST: $file"
            if bun test "./$file" > /tmp/worker-final.log 2>&1; then tail -n 7 /tmp/worker-final.log; else tail -n 180 /tmp/worker-final.log; exit 1; fi
          done
      - name: Verify management discovery ordering and safe no-op payload
        run: |
          python3 - <<'PY'
          import pathlib
          routes=pathlib.Path('src/server/management/config-routes.ts').read_text()
          section=routes[routes.index('if (url.pathname === "/api/update/run"'):routes.index('if (url.pathname === "/api/update/status"')]
          assert section.index('await prepareGuiUpdateWorkerLaunch()') < section.index('job: startUpdateJob(')
          worker=pathlib.Path('src/update/worker-launch.ts').read_text()
          assert 'spawnSync' not in worker
          assert '[...SYSTEMD_SCOPE_ARGS, path, "--version"]' in worker
          assert '[dirname(path), dirname(target)]' in worker
          PY
      - run: bun run typecheck
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun test tests/ci-workflows/file-size-ratchet.test.ts
      - run: git diff --exit-code
