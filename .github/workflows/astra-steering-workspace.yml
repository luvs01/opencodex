name: Prepare steering development workspace

on:
  push:
    branches: [codex/astra-steering-workspace-20260916]
    paths: [.github/workflows/astra-steering-workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned public upstream
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: lidge-jun/opencodex
          ref: 45cfb04e9757a5a257ab6290d9f24d2ea0bc7573
          persist-credentials: false
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Prepare offline development inputs
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          mkdir -p .offline-tools
          cp "$(command -v bun)" .offline-tools/bun
          git rev-parse HEAD > .offline-tools/upstream-sha.txt
          bun --version > .offline-tools/bun-version.txt
          # Only the public checkout, public dependencies and Bun are included.
          # Never archive runner home, environment, credentials or Git config.
          tar --exclude='./.git' --exclude='./assets' --exclude='./devlog' \
            --exclude='./gui/node_modules' -czf /tmp/opencodex-steering-workspace.tar.gz .
      - name: Upload short-lived workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencodex-steering-workspace
          path: /tmp/opencodex-steering-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
