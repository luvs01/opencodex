name: desktop installed-artifact gate

# D9 part two: install the real artifact on a machine per platform, launch it against a
# staged npm runtime, and exercise the ownership contract — takeover, the gestures that
# must leave the runtime alive, tray Quit draining an in-flight request, and on Linux
# both update paths (R3). Runs only on maintainer-registered self-hosted GUI machines;
# publication wiring into release.yml is a separate change.

on:
  # repository_dispatch always loads this workflow from the default branch. Unlike
  # workflow_dispatch, a caller cannot select a branch-owned workflow definition and
  # thereby route arbitrary steps onto these privileged self-hosted runners.
  repository_dispatch:
    types: [desktop-installed-gate]

permissions:
  contents: read

concurrency:
  group: desktop-installed-gate-${{ github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  validate:
    # repository_dispatch carries a free-form client_payload — nothing upstream
    # enforces required fields, so shape-check it on a hosted runner before a
    # privileged self-hosted machine is even scheduled or a maintainer approval is
    # requested. The patterns mirror parseGateArguments (strict semver, plain hook
    # file names) so a malformed event fails here instead of on the gate runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ github.event.client_payload['version'] }}
      FROM_VERSION: ${{ github.event.client_payload['from-version'] }}
      CONSENT_HOOK: ${{ github.event.client_payload['consent-hook'] }}
      TRAY_CLICK_HOOK: ${{ github.event.client_payload['tray-click-hook'] }}
      TRAY_QUIT_HOOK: ${{ github.event.client_payload['tray-quit-hook'] }}
      TRAY_CHECK_HOOK: ${{ github.event.client_payload['tray-check-hook'] }}
      TRAY_INSTALL_HOOK: ${{ github.event.client_payload['tray-install-hook'] }}
      ELEVATE_ACCEPT_HOOK: ${{ github.event.client_payload['elevate-accept-hook'] }}
    steps:
      - name: Validate the dispatch payload
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          hook_name='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          for pair in "version:$VERSION" "from-version:$FROM_VERSION"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if ! [[ "$value" =~ $semver ]]; then
              echo "client_payload.$name must be strict semver (x.y.z[-suffix]), got '$value'" >&2
              exit 1
            fi
          done
          for pair in "consent-hook:$CONSENT_HOOK" "tray-click-hook:$TRAY_CLICK_HOOK" "tray-quit-hook:$TRAY_QUIT_HOOK" "tray-check-hook:$TRAY_CHECK_HOOK" "tray-install-hook:$TRAY_INSTALL_HOOK" "elevate-accept-hook:$ELEVATE_ACCEPT_HOOK"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -n "$value" ] && ! [[ "$value" =~ $hook_name ]]; then
              echo "client_payload.$name must be a plain hook file name, got '$value'" >&2
              exit 1
            fi
          done

  macos:
    needs: validate
    runs-on: [self-hosted, opencodex-gate-macos]
    timeout-minutes: 60
    # Required-review environment: no run reaches the GUI runner without a maintainer
    # approval. repository_dispatch loads the workflow from the default branch, and the
    # checkout below pins the driver itself to the protected dev branch.
    environment: opencodex-desktop-gate
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: dev
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Download the release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.client_payload['version'] }}
          GATE_ARTIFACTS: ${{ runner.temp }}/gate-artifacts
        run: |
          mkdir -p "$GATE_ARTIFACTS"
          gh release download "v${RELEASE_VERSION}" \
            --pattern "OpenCodex-${RELEASE_VERSION}-macos.dmg" \
            --dir "$GATE_ARTIFACTS" \
            --clobber

      - name: Run the installed-artifact gate
        env:
          RELEASE_VERSION: ${{ github.event.client_payload['version'] }}
          FROM_VERSION: ${{ github.event.client_payload['from-version'] }}
          CONSENT_HOOK: ${{ github.event.client_payload['consent-hook'] }}
          TRAY_CLICK_HOOK: ${{ github.event.client_payload['tray-click-hook'] }}
          TRAY_QUIT_HOOK: ${{ github.event.client_payload['tray-quit-hook'] }}
          GATE_HOOKS_DIR: ${{ vars.OPENCODEX_GATE_HOOKS_DIR }}
          GATE_ARTIFACTS: ${{ runner.temp }}/gate-artifacts
          GATE_WORK: ${{ runner.temp }}/installed-gate
          GATE_REPORT: ${{ runner.temp }}/installed-gate-report.json
        run: |
          set -euo pipefail
          args=(
            --platform macos --format dmg
            --artifact "$GATE_ARTIFACTS/OpenCodex-${RELEASE_VERSION}-macos.dmg"
            --work-dir "$GATE_WORK"
            --to-version "$RELEASE_VERSION"
            --from-version "$FROM_VERSION"
            --report "$GATE_REPORT"
          )
          if [ -n "$GATE_HOOKS_DIR" ]; then args+=(--hooks-dir "$GATE_HOOKS_DIR"); fi
          for pair in "consent-hook:CONSENT_HOOK" "tray-click-hook:TRAY_CLICK_HOOK" "tray-quit-hook:TRAY_QUIT_HOOK"; do
            name="${pair%%:*}"; env_name="${pair##*:}"
            value="${!env_name}"
            if [ -n "$value" ]; then args+=("--${name}" "$value"); fi
          done
          bun desktop/scripts/installed-gate.ts "${args[@]}"

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-gate-report-macos
          path: ${{ runner.temp }}/installed-gate-report.json
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: [self-hosted, opencodex-gate-windows]
    timeout-minutes: 60
    environment: opencodex-desktop-gate
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: dev
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Download the release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.client_payload['version'] }}
          GATE_ARTIFACTS: ${{ runner.temp }}/gate-artifacts
        run: |
          mkdir -p "$GATE_ARTIFACTS"
          gh release download "v${RELEASE_VERSION}" \
            --pattern "OpenCodex-${RELEASE_VERSION}-windows-x64.msi" \
            --dir "$GATE_ARTIFACTS" \
            --clobber

      - name: Run the installed-artifact gate
        env:
          RELEASE_VERSION: ${{ github.event.client_payload['version'] }}
          FROM_VERSION: ${{ github.event.client_payload['from-version'] }}
          CONSENT_HOOK: ${{ github.event.client_payload['consent-hook'] }}
          TRAY_CLICK_HOOK: ${{ github.event.client_payload['tray-click-hook'] }}
          TRAY_QUIT_HOOK: ${{ github.event.client_payload['tray-quit-hook'] }}
          GATE_HOOKS_DIR: ${{ vars.OPENCODEX_GATE_HOOKS_DIR }}
          GATE_ARTIFACTS: ${{ runner.temp }}/gate-artifacts
          GATE_WORK: ${{ runner.temp }}/installed-gate
          GATE_REPORT: ${{ runner.temp }}/installed-gate-report.json
        run: |
          set -euo pipefail
          args=(
            --platform windows --format msi
            --artifact "$GATE_ARTIFACTS/OpenCodex-${RELEASE_VERSION}-windows-x64.msi"
            --work-dir "$GATE_WORK"
            --to-version "$RELEASE_VERSION"
            --from-version "$FROM_VERSION"
            --report "$GATE_REPORT"
          )
          if [ -n "$GATE_HOOKS_DIR" ]; then args+=(--hooks-dir "$GATE_HOOKS_DIR"); fi
          for pair in "consent-hook:CONSENT_HOOK" "tray-click-hook:TRAY_CLICK_HOOK" "tray-quit-hook:TRAY_QUIT_HOOK"; do
            name="${pair%%:*}"; env_name="${pair##*:}"
            value="${!env_name}"
            if [ -n "$value" ]; then args+=("--${name}" "$value"); fi
          done
          bun desktop/scripts/installed-gate.ts "${args[@]}"

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-gate-report-windows
          path: ${{ runner.temp }}/installed-gate-report.json
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: [self-hosted, opencodex-gate-linux]
    timeout-minutes: 60
    environment: opencodex-desktop-gate
    strategy:
      fail-fast: false
      matrix:
        format: [deb, appimage]
        include:
          - format: deb
            suffix: linux-amd64.deb
          - format: appimage
            suffix: linux-x86_64.AppImage
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: dev
          persist-credentials: false

      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun

      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.client_payload['version'] }}
          FROM_VERSION: ${{ github.event.client_payload['from-version'] }}
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
          GATE_ARTIFACTS: ${{ runner.temp }}/gate-artifacts
        run: |
          mkdir -p "$GATE_ARTIFACTS"
          gh release download "v${RELEASE_VERSION}" \
            --pattern "OpenCodex-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}" \
            --dir "$GATE_ARTIFACTS" \
            --clobber
          gh release download "v${FROM_VERSION}" \
            --pattern "OpenCodex-${FROM_VERSION}-${ARTIFACT_SUFFIX}" \
            --dir "$GATE_ARTIFACTS" \
            --clobber

      - name: Run the installed-artifact gate
        env:
          RELEASE_VERSION: ${{ github.event.client_payload['version'] }}
          FROM_VERSION: ${{ github.event.client_payload['from-version'] }}
          GATE_FORMAT: ${{ matrix.format }}
          ARTIFACT_SUFFIX: ${{ matrix.suffix }}
          CONSENT_HOOK: ${{ github.event.client_payload['consent-hook'] }}
          TRAY_CLICK_HOOK: ${{ github.event.client_payload['tray-click-hook'] }}
          TRAY_QUIT_HOOK: ${{ github.event.client_payload['tray-quit-hook'] }}
          TRAY_CHECK_HOOK: ${{ github.event.client_payload['tray-check-hook'] }}
          TRAY_INSTALL_HOOK: ${{ github.event.client_payload['tray-install-hook'] }}
          ELEVATE_ACCEPT_HOOK: ${{ github.event.client_payload['elevate-accept-hook'] }}
          GATE_HOOKS_DIR: ${{ vars.OPENCODEX_GATE_HOOKS_DIR }}
          GATE_ARTIFACTS: ${{ runner.temp }}/gate-artifacts
          GATE_WORK: ${{ runner.temp }}/installed-gate
          GATE_REPORT: ${{ runner.temp }}/installed-gate-report.json
        run: |
          set -euo pipefail
          args=(
            --platform linux --format "$GATE_FORMAT"
            --artifact "$GATE_ARTIFACTS/OpenCodex-${RELEASE_VERSION}-${ARTIFACT_SUFFIX}"
            --older-artifact "$GATE_ARTIFACTS/OpenCodex-${FROM_VERSION}-${ARTIFACT_SUFFIX}"
            --work-dir "$GATE_WORK"
            --to-version "$RELEASE_VERSION"
            --from-version "$FROM_VERSION"
            --report "$GATE_REPORT"
          )
          if [ -n "$GATE_HOOKS_DIR" ]; then args+=(--hooks-dir "$GATE_HOOKS_DIR"); fi
          for pair in "consent-hook:CONSENT_HOOK" "tray-click-hook:TRAY_CLICK_HOOK" "tray-quit-hook:TRAY_QUIT_HOOK" "tray-check-hook:TRAY_CHECK_HOOK" "tray-install-hook:TRAY_INSTALL_HOOK" "elevate-accept-hook:ELEVATE_ACCEPT_HOOK"; do
            name="${pair%%:*}"; env_name="${pair##*:}"
            value="${!env_name}"
            if [ -n "$value" ]; then args+=("--${name}" "$value"); fi
          done
          bun desktop/scripts/installed-gate.ts "${args[@]}"

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-gate-report-linux-${{ matrix.format }}
          path: ${{ runner.temp }}/installed-gate-report.json
          if-no-files-found: error
