name: Publish tested picker upload correction
on:
  push:
    branches: [codex/picker-upload-publication-20261006]
    paths: [.github/workflows/picker-upload-publication-20261006.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'luvs01/opencodex' && github.ref == 'refs/heads/codex/picker-upload-publication-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # Inert patch transport only. No dependency install or application/test execution with this token.
      - name: Verify the pinned seven-file tree and create a new candidate ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, subprocess
          from pathlib import Path
          base = '6774f0f6f26c103da144a630971091a52ada80a5'
          expected_tree = '71e6d25e0195c12ad21d61904aaf19ec699091a8'
          branch = 'codex/fix-picker-upload-lifetime-20261006'
          paths = {
              'src/claude/intercept/picker-listener.ts',
              'tests/claude-integration/claude-picker-upload.test.ts',
              'scripts/test-layout/layout.json',
              'tests/fixtures/test-layout-expected.json',
              'structure/clients/claude-desktop.md',
              'docs-site/src/content/docs/guides/claude-code.md',
              'docs-site/src/content/docs/ko/guides/claude-code.md',
          }
          if os.environ['GITHUB_REPOSITORY'] != 'luvs01/opencodex' or os.environ['GITHUB_REF'] != 'refs/heads/codex/picker-upload-publication-20261006':
              raise RuntimeError('unexpected repository or branch')
          patch = Path('scripts/picker-upload-publication-20261006/fix.patch').read_bytes()
          if len(patch) != 26356 or hashlib.sha256(patch).hexdigest() != '298282341dc18b2128b1c7da49d542e5eca273426347a5932db5da5929adb877':
              raise RuntimeError('patch checksum mismatch')
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='2',
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode(),
              GIT_CONFIG_KEY_1='core.hooksPath', GIT_CONFIG_VALUE_1='/dev/null',
              GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]',
              GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          def git(*args, data=None):
              p = subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env)
              if p.returncode:
                  raise RuntimeError('git ' + args[0] + ' failed: ' + p.stderr.decode(errors='replace'))
              return p.stdout.decode().strip()
          if git('remote', 'get-url', 'origin') not in ('https://github.com/luvs01/opencodex', 'https://github.com/luvs01/opencodex.git'):
              raise RuntimeError('unexpected remote')
          if git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch):
              raise RuntimeError('candidate branch exists; refusing overwrite')
          git('fetch', '--no-tags', '--depth=1', 'origin', base)
          git('checkout', '--detach', base)
          git('apply', '--index', '--check', '--whitespace=error-all', '-', data=patch)
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          git('diff', '--cached', '--check')
          tree = git('write-tree')
          if tree != expected_tree or set(git('diff', '--cached', '--name-only').splitlines()) != paths:
              raise RuntimeError('source tree or changed-file scope differs from tested candidate')
          message = ('fix(claude): bound picker upload lifetime and admission\n\n'
              'Keep unfinished uploads below a separate shared ceiling and enforce idle\n'
              'and absolute body deadlines on both relay protocols. Preserve completed\n'
              'uploads, long-lived responses, h2 session reuse and existing fan-out limits.\n\n'
              'Linux/Bun 1.4.0: 100 focused tests pass, including ten new regressions.\n'
              'Root typecheck, privacy, structure and whitespace checks pass.\n'
              'No native macOS/Desktop, live-provider or full-suite acceptance is claimed.\n\n'
              'Fork-only draft candidate; no integration, deployment or finding closure.\n')
          commit = git('commit-tree', tree, '-p', base, data=message.encode())
          git('push', 'origin', commit + ':refs/heads/' + branch)
          print('CANDIDATE_COMMIT=' + commit)
          print('VERIFIED_TREE=' + tree)
          PY
