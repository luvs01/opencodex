name: PR177 full suite and platform verification

on:
  push:
    branches: [codex/pr177-validation-20260916]
    paths: [.github/workflows/pr177-full-suite.yml]

permissions:
  contents: read

jobs:
  full-suite:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact published implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: cf57bc0c14f4fc4a88e112d4c72bd6e40019c3c8
          persist-credentials: false
          fetch-tags: true
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install frozen dependencies and build test assets
        run: |
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Run the complete repository test harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr177-full"
          git rev-parse HEAD > "$RUNNER_TEMP/pr177-full/head.txt"
          bun --version > "$RUNNER_TEMP/pr177-full/bun-version.txt"
          bun run test --parallel=4 --timeout=30000 2>&1 | tee "$RUNNER_TEMP/pr177-full/full-suite.txt"
      - name: Upload complete test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr177-full-suite-results
          path: ${{ runner.temp }}/pr177-full/
          retention-days: 7
          if-no-files-found: warn

  platform-regressions:
    if: github.repository == 'luvs01/opencodex'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout the exact published implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: cf57bc0c14f4fc4a88e112d4c72bd6e40019c3c8
          persist-credentials: false
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
      - name: Run native platform typecheck and targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr177-platform"
          git rev-parse HEAD > "$RUNNER_TEMP/pr177-platform/head.txt"
          bun --version > "$RUNNER_TEMP/pr177-platform/bun-version.txt"
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/pr177-platform/typecheck.txt"
          for file in tests/server/response-log-inspection.test.ts tests/usage/request-log-nonstream.test.ts tests/server/consume-for-inspection-cancel.test.ts; do
            echo "=== $file ===" | tee -a "$RUNNER_TEMP/pr177-platform/tests.txt"
            bun test "$file" --timeout 20000 2>&1 | tee -a "$RUNNER_TEMP/pr177-platform/tests.txt"
          done
      - name: Upload platform results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr177-platform-${{ matrix.os }}
          path: ${{ runner.temp }}/pr177-platform/
          retention-days: 7
          if-no-files-found: warn
