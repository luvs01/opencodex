name: Verify bounded native injection
on:
  push:
    branches: [codex/ws-inject-workspace-20260917]
    paths: [.github/workflows/native-injection-verify.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'luvs01/opencodex'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, lane: linux-1, shard: '1/4', focused: true }
          - { os: ubuntu-24.04, lane: linux-2, shard: '2/4', focused: false }
          - { os: ubuntu-24.04, lane: linux-3, shard: '3/4', focused: false }
          - { os: ubuntu-24.04, lane: linux-4, shard: '4/4', focused: false }
          - { os: windows-latest, lane: windows, shard: '', focused: true }
          - { os: macos-15, lane: macos, shard: '', focused: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 76d7452afb38fd7cc5d9ff7fa4d573b06a9507e3
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 16184ce47e17ffee83d6fa9fa2ed7c2033b97cf2
          path: payload
          sparse-checkout: .github/native-injection
          persist-credentials: false
      - name: Reproduce and verify exact reviewed source
        env:
          PYTHONUTF8: '1'
        run: python payload/.github/native-injection/prepare.py
      - uses: ./.github/actions/setup-project-bun
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install full-suite dependencies
        if: matrix.shard != ''
        working-directory: gui
        run: bun install --frozen-lockfile
      - name: Typecheck
        if: matrix.focused
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Injection, steering, shared transport and ownership tests
        if: matrix.focused
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/responses/ws-native-injection.test.ts tests/responses/ws-native-injection-state.test.ts tests/responses/ws-native-steering.test.ts tests/responses/ws-upstream.test.ts tests/responses/ws-upstream-reuse.test.ts tests/responses/ws-endpoint.test.ts tests/responses/ws-failure-stage.test.ts tests/responses/reserve-dispatch-ws.test.ts tests/responses/responses-state.test.ts tests/responses/responses-core-modules.test.ts tests/ci-workflows/file-size-ratchet.test.ts tests/test-layout.test.ts tests/test-layout-tooling.test.ts 2>&1 | tee evidence/focused.log
      - name: Privacy and architecture gates
        if: matrix.focused
        shell: bash
        run: |
          set -euo pipefail
          bun run privacy:scan 2>&1 | tee evidence/privacy.log
          bun run structure:check 2>&1 | tee evidence/structure.log
          git diff --check cfdf5c3795da41ec22bc4b754645f685cdc1d0c6 HEAD
      - name: Complete Linux regression shard
        if: matrix.shard != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-bun-test-batches.sh '${{ matrix.shard }}' 2>&1 | tee evidence/full-suite.log
      - name: Isolated storage and usage cases
        if: matrix.lane == 'linux-1'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            timeout 180 bun test "$file" > "evidence/$(basename "$file").log" 2>&1 || status=1
            cat "evidence/$(basename "$file").log"
          done < <(find tests -type f \( -name 'api-storage-policy*.test.ts' -o -name 'api-storage.test.ts' -o -name 'api-usage.test.ts' \) -print0)
          exit "$status"
      - name: Preserve exact-source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-injection-${{ matrix.lane }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
  docs:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 76d7452afb38fd7cc5d9ff7fa4d573b06a9507e3
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 16184ce47e17ffee83d6fa9fa2ed7c2033b97cf2
          path: payload
          sparse-checkout: .github/native-injection
          persist-credentials: false
      - run: python payload/.github/native-injection/prepare.py
      - uses: ./.github/actions/setup-project-bun
      - name: Build documentation without deployment
        shell: bash
        run: |
          set -euo pipefail
          BUN_BIN="$(command -v bun)"
          cd docs-site
          "$BUN_BIN" install --frozen-lockfile --ignore-scripts
          "$BUN_BIN" --bun run build 2>&1 | tee ../evidence/docs-build.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-injection-docs
          path: evidence
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [validate, docs]
    if: github.repository == 'luvs01/opencodex'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 76d7452afb38fd7cc5d9ff7fa4d573b06a9507e3
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 16184ce47e17ffee83d6fa9fa2ed7c2033b97cf2
          path: payload
          sparse-checkout: .github/native-injection
          persist-credentials: false
      - name: Reproduce verified commit without executing application code
        run: python payload/.github/native-injection/prepare.py
      - name: Fast-forward only the unchanged new feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=refs/heads/codex/native-response-injection-20260917
          current="$(git ls-remote https://github.com/luvs01/opencodex.git "$branch" | cut -f1)"
          test "$current" = 76d7452afb38fd7cc5d9ff7fa4d573b06a9507e3
          test "$(git rev-parse HEAD)" = d624a5c8aee65c10a00a883975f7703108b7a28b
          test "$(git rev-parse HEAD^{tree})" = 8620418485e7498b4f91d392839cfeecf95ff9a0
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push https://github.com/luvs01/opencodex.git "HEAD:$branch"
          cat evidence/source-identity.json >> "$GITHUB_STEP_SUMMARY"
