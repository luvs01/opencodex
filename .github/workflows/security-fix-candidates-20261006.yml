name: Publish exact tested fork corrections
on:
  push:
    branches: [codex/pr701-offline-workspace-20261004]
    paths: [.github/workflows/security-fix-candidates-20261006.yml]
permissions:
  contents: read
concurrency:
  group: security-fix-candidates-20261006
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'luvs01/opencodex' && github.ref == 'refs/heads/codex/pr701-offline-workspace-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # Only transport pre-verified patches; do not run repository code with the write token.
      - name: Verify both trees and publish new refs atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile, zlib
          from pathlib import Path
          repo = 'luvs01/opencodex'
          base = '6774f0f6f26c103da144a630971091a52ada80a5'
          if os.environ['GITHUB_REPOSITORY'] != repo or os.environ['GITHUB_REF'] != 'refs/heads/codex/pr701-offline-workspace-20261004':
              raise RuntimeError('Unexpected repository or ref')
          plans = [
              dict(name='ollama', branch='codex/fix-ollama-attribution-budget-20261006',
                   tree='68078e248199e3314b480d7964a602792ff43ed9', length=7393,
                   digest='4761e1be679bc56546bd359789a5051d8cb95a3d6ffc8970bfc511cc30dcf99c',
                   title='fix(ollama): bound generated late-tool attribution',
                   evidence='Exact-tree Linux/Bun 1.4.0: 134 focused tests passed; typecheck, privacy, structure and whitespace checks passed. Four new negative cases fail on the original source. No live provider, full suite or native-platform claim.',
                   paths={'src/adapters/ollama-native.ts', 'structure/providers/chat-compat.md', 'tests/providers/ollama/ollama-native-tool-continuations.test.ts'}),
              dict(name='windows', branch='codex/fix-windows-lease-diagnostic-20261006',
                   tree='b8a6bd2ec7b7c0104d8d0e2ccc145cf6bd38b8b1', length=11225,
                   digest='11523bfbf69c1c4f8d61bfbd6c044444493a223ed44914defdb51ed1fdc5b2e3',
                   title='fix(service): avoid Windows executable lookup in lease diagnostics',
                   evidence='Exact-tree Linux/Bun 1.4.0: 94 focused tests passed; typecheck, privacy, structure and whitespace checks passed. New regression fails on original source. Node 22 simulated-Windows check passed, not native Windows. Broader update/restart run timed out; no full-suite pass claimed.',
                   paths={'src/service/ownership-mutation-lease.mjs', 'src/service/ownership-mutation-lease.d.mts', 'tests/service/service-ownership-state.test.ts', 'structure/ops/service-and-sidecars.md', 'structure/runtime.md', 'docs-site/src/content/docs/reference/cli/lifecycle.md', 'docs-site/src/content/docs/ko/reference/cli/lifecycle.md'}),
          ]
          for plan in plans:
              encoded = Path('scripts/security-fix-transport-20261006', plan['name'] + '.b64').read_bytes()
              if len(encoded) > 10000:
                  raise RuntimeError('Oversized transfer input')
              decoder = zlib.decompressobj()
              patch = decoder.decompress(base64.b64decode(encoded.strip(), validate=True), plan['length'] + 1)
              if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(patch) != plan['length']:
                  raise RuntimeError('Invalid bounded patch envelope: ' + plan['name'])
              if hashlib.sha256(patch).hexdigest() != plan['digest']:
                  raise RuntimeError('Patch checksum mismatch: ' + plan['name'])
              plan['patch'] = patch
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode(),
              GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]',
              GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          def git(*args, data=None, index_env=None):
              result = subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=index_env or env)
              if result.returncode:
                  raise RuntimeError('git ' + args[0] + ' failed with exit code ' + str(result.returncode))
              return result.stdout.decode().strip()
          if git('remote', 'get-url', 'origin') not in ('https://github.com/' + repo, 'https://github.com/' + repo + '.git'):
              raise RuntimeError('Unexpected remote')
          for plan in plans:
              if git('ls-remote', '--heads', 'origin', 'refs/heads/' + plan['branch']):
                  raise RuntimeError('Ref already exists; no overwrite: ' + plan['branch'])
          git('fetch', '--no-tags', '--depth=1', 'origin', base)
          commits = []
          for plan in plans:
              with tempfile.TemporaryDirectory(prefix='ocx-exact-index-') as tmp:
                  index_env = {**env, 'GIT_INDEX_FILE': str(Path(tmp) / 'index')}
                  git('read-tree', base, index_env=index_env)
                  git('apply', '--cached', '--check', '--whitespace=error-all', '-', data=plan['patch'], index_env=index_env)
                  git('apply', '--cached', '--whitespace=error-all', '-', data=plan['patch'], index_env=index_env)
                  git('diff', '--cached', '--check', base, index_env=index_env)
                  tree = git('write-tree', index_env=index_env)
                  if tree != plan['tree']:
                      raise RuntimeError('Tree differs from tested source: ' + plan['name'])
                  if set(git('diff', '--cached', '--name-only', base, index_env=index_env).splitlines()) != plan['paths']:
                      raise RuntimeError('Unexpected changed-file scope')
                  message = plan['title'] + '\n\n' + plan['evidence'] + '\n\nFork-only draft candidate; no integration, release or finding closure.\n'
                  commit = git('commit-tree', tree, '-p', base, data=message.encode(), index_env=index_env)
                  commits.append((plan['branch'], commit, tree))
          # No force-push. Only the two new branch refs are written after both preflights succeed.
          git('push', '--atomic', 'origin', *(sha + ':refs/heads/' + branch for branch, sha, tree in commits))
          for branch, sha, tree in commits:
              print(json.dumps(dict(branch=branch, commit=sha, tree=tree)))
          PY
