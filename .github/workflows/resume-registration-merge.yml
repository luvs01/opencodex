name: Author test-registration merge
on:
  push:
    branches: [automation/pr-resume-20260927]
    paths: [.github/workflows/resume-registration-merge.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    outputs:
      candidates: ${{ steps.publish.outputs.candidates }}
    steps:
      - name: Preserve existing registrations and reject competing mappings
        run: |
          python3 - <<'PY'
          import urllib.request,subprocess,yaml
          url='https://raw.githubusercontent.com/luvs01/opencodex/56c8257219a227f0cc3ac14f3cab4d6cb7d05d95/.github/workflows/resume-integration-verified.yml'
          with urllib.request.urlopen(url,timeout=30) as r:workflow=yaml.safe_load(r.read())
          script=workflow['jobs']['prepare']['steps'][0]['run']
          old="cases={6037:'75f8497d83d2ca293ebbafc4ea26eca75b79f60d',6050:'ff1ad0b72e4b5dd669b3c68938d3261a9912fcd4',6049:'e598ebc56c4f041d0899d63e9531760284e5b69a',6043:'05548a4137808261eb3c7349212690d2f43e3434'}"
          assert script.count(old)==1
          script=script.replace(old,"cases={6050:'ff1ad0b72e4b5dd669b3c68938d3261a9912fcd4',6049:'e598ebc56c4f041d0899d63e9531760284e5b69a'}")
          old="        if key in out:raise ValueError('Duplicate JSON key')"
          new="        if key in out and out[key]!=value:raise ValueError('Competing duplicate JSON mappings: '+key)\n        if key in out:print('PRESERVED_IDENTICAL_REGISTRATION',key)"
          assert script.count(old)==1;script=script.replace(old,new)
          # Source text is otherwise unchanged. Newly inserted keys are required absent from
          # incoming mappings, so this does not add duplicate registrations or weaken any gate.
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Publish isolated candidates only
        id: publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)";echo "::add-mask::$auth"
          export PUSH_HEADER="AUTHORIZATION: basic $auth"
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'integrate';data=json.loads((root/'candidates.json').read_text())
          for row in data['include']:
              subprocess.run(['git','-C',str(root/row['pr']),'-c','http.https://github.com/.extraheader='+os.environ['PUSH_HEADER'],'push','https://github.com/luvs01/opencodex','HEAD:refs/heads/automation/resume-registration-pr'+row['pr']+'-20260927'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('candidates='+json.dumps(data)+'\n')
          PY
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.candidates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Run all focused native files
        env:
          TEST_FILES: ${{ toJSON(matrix.tests) }}
        run: python3 -c 'import json,os,subprocess;subprocess.run(["bun","test",*json.loads(os.environ["TEST_FILES"])],check=True)'
      - run: bun run typecheck
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun test tests/ci-workflows/file-size-ratchet.test.ts tests/test-layout.test.ts tests/test-layout-tooling.test.ts
      - run: git diff --exit-code
