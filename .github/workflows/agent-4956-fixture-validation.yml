name: Issue 4956 scoped fixture validation

on:
  push:
    branches: [agent/4956-fixture-validation-20260918]
    paths: [.github/workflows/agent-4956-fixture-validation.yml]

# Fork-only validation companion, excluded from upstream PR #5014.
# Supersedes the earlier queued patch-assembly run: the candidate already exists.
# No assembly, writes, secrets, dependency cache, or self-hosted runners.
permissions:
  contents: read

concurrency:
  group: issue-4956-scoped-validation
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout the exact PR candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: d2eb664118408d281843c111cfd0dcdf6313fcdb
          persist-credentials: false
          fetch-tags: true
      - name: Verify pinned tree and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d2eb664118408d281843c111cfd0dcdf6313fcdb
          test "$(git rev-parse 'HEAD^{tree}')" = 3175c112668b2e7ea6a6516b60f015e9d5fc3524
          git show --format=fuller --stat HEAD
          git show --format= --check HEAD
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install locked dependencies and build test assets
        shell: bash
        run: |
          set -euo pipefail
          bun --version
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
          bun run build:gui
      - name: Fixture contracts and test registration
        timeout-minutes: 3
        shell: bash
        run: bun test --isolate --timeout 60000 tests/server/server-combo-held-response.test.ts tests/test-layout.test.ts tests/test-layout-tooling.test.ts
      - name: Exact cancellation regression
        timeout-minutes: 3
        shell: bash
        run: bun test --isolate --timeout 60000 tests/server/server-combo-failover-e2e.test.ts -t 'connect cancellation wins with 499, no backup, warning, or cooldown'
      - name: Entire combo failover test file
        timeout-minutes: 8
        shell: bash
        run: bun test --isolate --timeout 60000 tests/server/server-combo-failover-e2e.test.ts
      - name: Type and repository gates
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bun run structure:check
          bun run privacy:scan
          bun scripts/file-size-ratchet.ts
