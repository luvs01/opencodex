name: Resumed physical-home evidence
on:
  push:
    branches: [automation/pr-resume-20260927]
    paths: [.github/workflows/resume-home-evidence.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 8cf6eaa18de0e41ccc5370d10b7d5d770c9d6853
          persist-credentials: false
      - name: Correct only the reviewed docs and foreign-home fixture
        run: |
          python3 - <<'PY'
          import pathlib
          def replace(path,old,new):
              p=pathlib.Path(path); text=p.read_text(); assert text.count(old)==1,(path,text.count(old)); p.write_text(text.replace(old,new))
          replace('structure/codex-home.md',
              'home, and the unattended ownership preflight. Access or transient I/O errors are unknown rather\nthan foreign in preflight; distinct spellings with missing/non-directory paths remain mismatches.',
              'home, and the unattended ownership preflight. For distinct spellings, any failed realpath lookup\n(including missing or non-directory components, access denial, or I/O errors) is unknown, not foreign.')
          replace('docs-site/src/content/docs/reference/cli/lifecycle.md',
              'Home paths inside a state record are compared with the current home by the physical directory they\nresolve to, not just their spelling. A junction or symlink recorded under an older install still\nnames the same home and keeps working after the move; an alias that no longer resolves is only\ntreated as a different home when its recorded spelling also differs from the current one, so a\nstale mount still produces the foreign-owner refusal instead of silently claiming the runtime.',
              'Identical normalized home paths in a state record match without a filesystem lookup. When their\nspellings differ, the comparison resolves both physical paths: a junction or symlink alias to the\nsame home still matches. If either lookup fails, including a missing path or stale mount, ownership\nis unknown rather than definitely foreign. Lifecycle changes still refuse that unknown result;\nrestore the recorded path or correct the home selection before retrying.')
          replace('tests/codex-integration/codex-composed-acceptance.test.ts',
              '    writeFileSync(join(fx.ocx, "service-state.json"), JSON.stringify({\n      version: 2,\n      codexHome: join(fx.root, "foreign-codex"),',
              '    // This case proves different physical homes, not an unresolved spelling.\n    mkdirSync(join(fx.root, "foreign-codex"));\n    mkdirSync(join(fx.root, "foreign-ocx"));\n    writeFileSync(join(fx.ocx, "service-state.json"), JSON.stringify({\n      version: 2,\n      codexHome: join(fx.root, "foreign-codex"),')
          PY
          git diff --check
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'test(service): distinguish physical foreign homes from unknown aliases'
      - name: Publish isolated candidate only
        id: publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/luvs01/opencodex HEAD:refs/heads/automation/resume-home-pr6036-20260927
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test tests/codex-integration/codex-composed-acceptance.test.ts --test-name-pattern 'D-reduced|D-unknown'
      - run: bun test tests/service/service-sqlite-home.test.ts tests/service/service-wsl-home-ownership.test.ts tests/codex-integration/codex-home-wsl.test.ts tests/codex-integration/codex-service-manager-probe-hardening.test.ts tests/codex-integration/codex-service-manager-probe.test.ts
      - run: bun run typecheck
      - if: matrix.os == 'ubuntu-latest'
        run: bun run privacy:scan
      - if: matrix.os == 'ubuntu-latest'
        run: bun run structure:check
      - if: matrix.os == 'ubuntu-latest'
        run: bun test tests/file-size.test.ts
      - if: matrix.os == 'ubuntu-latest'
        working-directory: docs-site
        run: bun install --frozen-lockfile
      - if: matrix.os == 'ubuntu-latest'
        working-directory: docs-site
        run: bun run build
      - run: git diff --exit-code
