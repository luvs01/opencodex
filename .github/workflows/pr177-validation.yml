name: PR177 isolated implementation validation

on:
  push:
    branches: [codex/pr177-validation-20260916]
    paths: [.github/workflows/pr177-validation.yml, '.github/pr177/**']

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout author-controlled preparation payload
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Preserve payload outside the checkout
        run: cp -R .github/pr177 "$RUNNER_TEMP/pr177-payload"
      - name: Checkout exact upstream baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 3070d64d8822c6d8c62989665f82ab665e4d164c
          persist-credentials: false
      - name: Prepare reviewed source, regression tests and ownership docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr177-result"
          node "$RUNNER_TEMP/pr177-payload/apply.cjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pr177-payload"
          git add -A
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/pr177-result/change.patch"
          git diff --cached --stat > "$RUNNER_TEMP/pr177-result/stat.txt"
          git write-tree > "$RUNNER_TEMP/pr177-result/tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/pr177-result/baseline.txt"
          git diff --cached --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/pr177-result/changed-files.tar.gz"
      - name: Setup project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Install frozen test dependencies
        run: |
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          bun --version | tee "$RUNNER_TEMP/pr177-result/bun-version.txt"
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/pr177-result/typecheck.txt"
      - name: Run focused tests in separate Bun processes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files tests | grep -E '/(response-log-inspection|request-log[^/]*|consume-for-inspection[^/]*|relay[^/]*|sse-inspect[^/]*)\.test\.ts$')
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/pr177-result/focused-files.txt"
          test "${#files[@]}" -ge 4
          for file in "${files[@]}"; do
            echo "=== $file ===" | tee -a "$RUNNER_TEMP/pr177-result/focused-tests.txt"
            bun test "$file" --timeout 20000 2>&1 | tee -a "$RUNNER_TEMP/pr177-result/focused-tests.txt"
          done
      - name: Layout, structure and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/test-layout.test.ts tests/test-layout-tooling.test.ts 2>&1 | tee "$RUNNER_TEMP/pr177-result/layout.txt"
          bun run structure:check 2>&1 | tee "$RUNNER_TEMP/pr177-result/structure.txt"
          bun run privacy:scan 2>&1 | tee "$RUNNER_TEMP/pr177-result/privacy.txt"
      - name: Build documentation
        shell: bash
        run: |
          set -euo pipefail
          cd docs-site
          bun install --frozen-lockfile
          bun run build 2>&1 | tee "$RUNNER_TEMP/pr177-result/docs-build.txt"
      - name: Verify the tested snapshot is unchanged
        run: git diff --exit-code
      - name: Upload scoped implementation and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr177-implementation-evidence
          path: ${{ runner.temp }}/pr177-result/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact upstream baseline without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 3070d64d8822c6d8c62989665f82ab665e4d164c
          persist-credentials: false
      - name: Download this run's verified patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr177-implementation-evidence
          path: ${{ runner.temp }}/pr177-result
      - name: Publish only the reviewed tree to the dedicated feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=3070d64d8822c6d8c62989665f82ab665e4d164c
          branch=codex/pr177-bounded-response-inspection-20260916
          test "$(cat "$RUNNER_TEMP/pr177-result/baseline.txt")" = "$base"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$base"
          git apply --index --check "$RUNNER_TEMP/pr177-result/change.patch"
          git apply --index "$RUNNER_TEMP/pr177-result/change.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/pr177-result/tree.txt")"
          if git diff --cached --name-only | grep -Ev '^(src/server/(response-log-body\.ts|inspection-tee\.ts|relay\.ts|responses/passthrough-delivery\.ts)|tests/(server/response-log-inspection\.test\.ts|usage/request-log-nonstream\.test\.ts|fixtures/test-layout-expected\.json)|scripts/test-layout/layout\.json|structure/[^[:space:]]+\.md|docs-site/src/content/docs/guides/response-inspection\.md)$'; then
            echo 'Refusing an unexpected changed path'
            exit 1
          fi
          git -c user.name=luvs01 -c user.email=27862058+luvs01@users.noreply.github.com -c core.hooksPath=/dev/null commit -m 'fix(logs): bound response inspection without losing SSE finality' -m 'Adapt luvs01/opencodex#177 and #106 onto current dev. Preserve terminal ownership with bounded tee read-ahead, stream non-SSE bodies, and cover cancellation races.'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD | tee "$RUNNER_TEMP/pr177-result/published-commit.txt"
      - name: Upload published commit identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr177-published-identity
          path: ${{ runner.temp }}/pr177-result/published-commit.txt
          retention-days: 7
          if-no-files-found: error
