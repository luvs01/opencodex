name: Final exact-blob gates and native steering publication

on:
  push:
    branches: [codex/astra-steering-workspace-20260916]
    paths: [.github/workflows/astra-steering-final-gates.yml]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows-static:
    if: github.repository == 'luvs01/opencodex'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 978b27c2478e5dabc93829a1d920b84a09614fae
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 7b9f031efb428a3e694c908526fd313ccb82b26e
          path: payload
          sparse-checkout: .github/steering-followup
          persist-credentials: false
      - run: python payload/.github/steering-followup/prepare-integrated.py
      - name: Restore exact committed bytes for the two script-written files
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('rev-parse', 'HEAD').decode().strip() == '5cfc0c8795e128c2876aa20d75dbf3644fe65687'
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == 'd0eb5fbbc84cb87f8304ea5e779d8dc5553b8d9b'
          # Binary writes avoid Python's implicit Windows CRLF translation and
          # Git checkout-index's up-to-date worktree optimization. The source
          # blob and index remain exactly the already-tested commit.
          for name in ['structure/runtime.md', 'tests/helpers/responses-core-source.ts']:
              expected = git('show', 'HEAD:' + name)
              Path(name).write_bytes(expected)
              assert Path(name).read_bytes() == expected and b'\r\n' not in expected
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD'], check=True)
      - uses: ./.github/actions/setup-project-bun
      - run: bun install --frozen-lockfile
      - name: Privacy and structure gates
        shell: bash
        run: |
          set -euo pipefail
          bun run privacy:scan 2>&1 | tee evidence/privacy.log
          bun run structure:check 2>&1 | tee evidence/structure.log
          git diff --check b3035fe292168bc598b5d67e77203e2b65404578 HEAD
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrated-steering-windows-exact-blob-gates
          path: evidence
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: windows-static
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require the successful exact-test evidence collector
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request
          root = 'https://api.github.com/repos/luvs01/opencodex/actions/runs/35049844047'
          def get(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run = get(root)
          assert run['head_sha'] == 'b3d2c141897a87705a07966851ce93fa79623d09'
          jobs = get(root + '/jobs?per_page=100')['jobs']
          collector = next(j for j in jobs if j['name'] == 'passed-tests')
          assert collector['status'] == 'completed' and collector['conclusion'] == 'success'
          print('Verified all Linux shards/isolated tests, three-platform focused tests and typechecks, macOS/Linux gates and documentation evidence.')
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 978b27c2478e5dabc93829a1d920b84a09614fae
          fetch-depth: 32
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 7b9f031efb428a3e694c908526fd313ccb82b26e
          path: payload
          sparse-checkout: .github/steering-followup
          persist-credentials: false
      - name: Reproduce the tested commit without executing application code
        run: python payload/.github/steering-followup/prepare-integrated.py
      - name: Publish only the verified feature branch without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5cfc0c8795e128c2876aa20d75dbf3644fe65687
          test "$(git rev-parse HEAD^{tree})" = d0eb5fbbc84cb87f8304ea5e779d8dc5553b8d9b
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push https://github.com/luvs01/opencodex.git HEAD:refs/heads/codex/astra-native-steering-20260916
          printf 'Feature commit: `%s`\nTree: `%s`\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
