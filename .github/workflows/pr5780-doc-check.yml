name: PR 5780 documentation check
on:
  push:
    branches: [automation/pr5780-ownership-validation-20260925]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Relocate backup explanation without changing tested code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cf2efa6c61916888733a4a1019cc3ba5e64336d9
          python3 -I - <<'PY'
          from pathlib import Path
          detail = 'Per-catalog hashed backups are recorded only after a new backup is successfully written by\n`src/codex/catalog/parsing.ts` or published by `src/codex/internal/catalog-writer.ts`.\nPreserving an existing file does not register it, even if its deterministic name or bytes match.\nPreviously recorded paths keep their ownership; unrecorded pre-ledger backups remain residuals.\nAfter stopping OpenCodex and completing any needed restore, review and archive those exact residual\npaths before manually removing only confirmed obsolete backups. Never infer ownership from a glob.\nThe legacy fixed-name entries already present in ownership manifests are not migrated by this rule.'
          p = Path('structure/config.md')
          text = p.read_text()
          assert text.count(detail) == 1
          text = text.replace(detail, 'Per-catalog hashed backups follow the [catalog ownership rules](catalog.md#shared-catalog):\nonly new writes are registered; existing unrecorded files remain for manual review.')
          assert len(text.splitlines()) <= 600
          p.write_text(text)
          p = Path('structure/catalog.md')
          text = p.read_text()
          old = 'Per-catalog hashed backup cleanup follows the [recorded ownership contract](config.md#restore):\nonly a new successful write/publication records a path; an existing backup is not adopted by name.'
          assert text.count(old) == 1
          text = text.replace(old, detail + '\nUninstall retains the [manifest validation and residual reporting contract](config.md#restore).')
          assert len(text.splitlines()) <= 600
          p.write_text(text)
          Path('.github/workflows/pr5780-doc-check.yml').unlink()
          PY
          git diff --check
      - name: Commit documentation only on the isolated branch
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add structure/config.md structure/catalog.md .github/workflows/pr5780-doc-check.yml
          git -c core.hooksPath=/dev/null commit -m 'docs: fit backup ownership guidance within existing structure budgets'
          test "$(git diff --name-only cf2efa6c61916888733a4a1019cc3ba5e64336d9 HEAD | sort)" = "$(printf 'structure/catalog.md\nstructure/config.md')"
          git -c core.hooksPath=/dev/null -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/automation/pr5780-ownership-validation-20260925
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  docs:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Resolve project Bun
        id: bun
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').dependencies.bun + '\n')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Structure check without changing limits
        run: bun run structure:check
      - name: Privacy scan including updated guidance
        run: bun run privacy:scan
      - name: Verify source stayed clean
        run: git diff --exit-code
