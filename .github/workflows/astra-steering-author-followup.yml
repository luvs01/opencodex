name: Verify PR 4782 author follow-up
on:
  push:
    branches: [codex/astra-steering-workspace-20260916]
    paths: [.github/workflows/astra-steering-author-followup.yml]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    if: github.repository == 'luvs01/opencodex'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, lane: linux-1, shard: '1/4', focused: true }
          - { os: ubuntu-24.04, lane: linux-2, shard: '2/4', focused: false }
          - { os: ubuntu-24.04, lane: linux-3, shard: '3/4', focused: false }
          - { os: ubuntu-24.04, lane: linux-4, shard: '4/4', focused: false }
          - { os: windows-latest, lane: windows, shard: '', focused: true }
          - { os: macos-15, lane: macos, shard: '', focused: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 5cfc0c8795e128c2876aa20d75dbf3644fe65687
          fetch-depth: 128
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: e2a58fc06427733d314abd58be85b3db4e3dc0a3
          path: payload
          sparse-checkout: .github/steering-review-fix
          persist-credentials: false
      - name: Reproduce exact locally reviewed source
        run: python payload/.github/steering-review-fix/prepare.py
      - uses: ./.github/actions/setup-project-bun
      - name: Install locked runtime dependencies
        run: bun install --frozen-lockfile
      - name: Install full-suite dependencies
        if: matrix.shard != ''
        working-directory: gui
        run: bun install --frozen-lockfile
      - name: Typecheck
        if: matrix.focused
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Focused transport and ownership regressions
        if: matrix.focused
        shell: bash
        run: |
          set -euo pipefail
          bun test tests/responses/ws-native-steering.test.ts tests/responses/ws-upstream.test.ts tests/responses/ws-upstream-reuse.test.ts tests/responses/ws-endpoint.test.ts tests/responses/ws-failure-stage.test.ts tests/responses/reserve-dispatch-ws.test.ts tests/responses/responses-state.test.ts tests/responses/responses-core-modules.test.ts tests/ci-workflows/file-size-ratchet.test.ts tests/test-layout.test.ts tests/test-layout-tooling.test.ts 2>&1 | tee evidence/focused-tests.log
      - name: Privacy and structure checks
        if: matrix.focused
        shell: bash
        run: |
          set -euo pipefail
          bun run privacy:scan 2>&1 | tee evidence/privacy.log
          bun run structure:check 2>&1 | tee evidence/structure.log
          git diff --check ada3a9b1b5fdac1fd47dfede0bbab4ef3ca4c6aa HEAD
      - name: Full upstream Linux regression shard
        if: matrix.shard != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/run-bun-test-batches.sh '${{ matrix.shard }}' 2>&1 | tee evidence/full-suite.log
      - name: Isolated storage and usage cases
        if: matrix.lane == 'linux-1'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            timeout 180 bun test "$file" > "evidence/$(basename "$file").log" 2>&1 || status=1
            cat "evidence/$(basename "$file").log"
          done < <(find tests -type f \( -name 'api-storage-policy*.test.ts' -o -name 'api-storage.test.ts' -o -name 'api-usage.test.ts' \) -print0)
          exit "$status"
      - name: Retain source identity and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr4782-followup-${{ matrix.lane }}
          path: evidence
          retention-days: 7
          if-no-files-found: ignore
  docs:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 5cfc0c8795e128c2876aa20d75dbf3644fe65687
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: e2a58fc06427733d314abd58be85b3db4e3dc0a3
          path: payload
          sparse-checkout: .github/steering-review-fix
          persist-credentials: false
      - run: python payload/.github/steering-review-fix/prepare.py
      - uses: ./.github/actions/setup-project-bun
      - name: Build documentation without deployment
        shell: bash
        run: |
          set -euo pipefail
          BUN_BIN="$(command -v bun)"
          cd docs-site
          "$BUN_BIN" install --frozen-lockfile --ignore-scripts
          "$BUN_BIN" --bun run build 2>&1 | tee ../evidence/docs-build.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr4782-followup-docs
          path: evidence
          retention-days: 7
          if-no-files-found: ignore
  # Only this isolated publication job can write. No dependency installation,
  # application/test execution or repository hooks run with write permission.
  publish:
    needs: [verify, docs]
    if: github.repository == 'luvs01/opencodex'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 5cfc0c8795e128c2876aa20d75dbf3644fe65687
          fetch-depth: 128
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: e2a58fc06427733d314abd58be85b3db4e3dc0a3
          path: payload
          sparse-checkout: .github/steering-review-fix
          persist-credentials: false
      - name: Reproduce the exact verified commit and tree
        run: python payload/.github/steering-review-fix/prepare.py
      - name: Fast-forward existing feature branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=refs/heads/codex/astra-native-steering-20260916
          current="$(git ls-remote https://github.com/luvs01/opencodex.git "$branch" | cut -f1)"
          test "$current" = 5cfc0c8795e128c2876aa20d75dbf3644fe65687
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push https://github.com/luvs01/opencodex.git "HEAD:$branch"
          printf 'Published commit: `%s`\nTree: `%s`\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
