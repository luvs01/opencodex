name: Resumed lifecycle corrections
on:
  push:
    branches: [automation/pr-resume-20260927]
    paths: [.github/workflows/resume-lifecycle-fixes.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidates: ${{ steps.publish.outputs.candidates }}
    steps:
      - name: Prepare scoped corrections without running repository code
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lifecycle'; root.mkdir()
          cases={6043:'c9c936c71d6d3191fec179b7f5fc1598eb816b93',6047:'1fe3e0aa090af1aaba41cb4b60e22e990859181f'}
          def git(cwd,*args): return subprocess.check_output(['git','-C',str(cwd),*args],text=True).strip()
          def replace(cwd,path,old,new,count=1):
              p=cwd/path; text=p.read_text(); assert text.count(old)==count,(path,text.count(old),count); p.write_text(text.replace(old,new))
          for n,sha in cases.items():
              cwd=root/str(n); cwd.mkdir(); git(cwd,'init'); git(cwd,'config','core.hooksPath','/dev/null')
              git(cwd,'fetch','--no-tags','--depth=3','https://github.com/luvs01/opencodex',sha); git(cwd,'checkout','--detach',sha)
              git(cwd,'config','user.name','github-actions[bot]'); git(cwd,'config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              if n==6047:
                  # The published candidate's doc is 604 lines: drop the standalone section and
                  # carry the lease contract in the sidecar-execution.ts owner row instead (-4 net).
                  # The ADR link lines stay untouched: the gate only recognizes the singular
                  # '> Decision record:' form, one record per line.
                  replace(cwd,'structure/transports/responses.md','### Sidecar probe lifetime\n\n`src/server/responses/sidecar-execution.ts` releases an acquired search probe immediately for local validation refusals. An upstream response with a body retains the probe through completion, error, or cancellation, regardless of HTTP status; the core dispatcher does not infer body settlement from a non-success status. Bodyless sidecar responses release before returning.\n\n','')
                  replace(cwd,'structure/transports/responses.md','| `sidecar-execution.ts` | Image/video versus web-search execution and their shared rotation hook. |','| `sidecar-execution.ts` | Image/video versus web-search execution and their shared rotation hook. An acquired search probe releases immediately for local validation refusals; an upstream response with a body retains it through completion, error, or cancellation regardless of HTTP status — the core dispatcher does not infer body settlement from a non-success status — and bodyless sidecar responses release before returning. |')
                  msg='docs(responses): keep sidecar settlement contract within document budget'
              else:
                  p='src/codex/native-profile-startup.ts'
                  replace(cwd,p,'  settled: Promise<NativeMainStartupGateSnapshot>;\n  resolveAcquisition?', '  settled: Promise<NativeMainStartupGateSnapshot>;\n  /** Publication provenance only; never substitutes for the live convergence drain. */\n  snapshotSettled?: Promise<NativeMainStartupGateSnapshot>;\n  resolveAcquisition?')
                  replace(cwd,p,'&& (epoch === releasedEpoch || settled === entry!.settled))','&& (epoch === releasedEpoch || settled === entry!.settled || settled === entry!.snapshotSettled))')
                  replace(cwd,p,'  // Keep the live entry provably the snapshot\'s owner: the global epoch just advanced past it,\n  // so without this rebind a release mistakes a later entry-published cleanup fence for an\n  // independent transaction snapshot and orphans it behind 503s.\n  if (entry) entry.settled = settled;', '  // Remember who published this snapshot without replacing an in-flight recovery/sweep\n  // promise: last-reference release must still drain that original convergence chain.\n  if (entry) entry.snapshotSettled = settled;')
                  p='tests/codex-integration/native-profile-startup-release.test.ts'
                  replace(cwd,p,'import { withNativeMainExclusiveClaim }','import { nativeMainOwnerSnapshot } from "../../src/codex/native-main-owner";\nimport { withNativeMainExclusiveClaim }')
                  marker='describe("a released native-main startup entry cannot leave the process fenced", () => {\n'
                  test='''  test("hard-lock-off recovery completion keeps the convergence drain and owner until the sweep ends", async () => {
              const f = fabricatedHome("complete-before-release-drain");
              writeFileSync(join(process.env.OPENCODEX_HOME!, "config.json"), JSON.stringify({ codexMainAccountHardLock: false }));
              const recovery = barrier(), recoveryEntered = barrier(), sweep = barrier(), sweepEntered = barrier();
              let state: NativeProfileRecoveryState = "journal";
              const lifecycle = startLifecycle({
                manager: fabricatedManager(f.context, { sweepStages: async () => {
                  sweepEntered.open(); await sweep.promise; return { plaintextMayRemain: false };
                } }),
                probeRecoveryState: () => state,
                beforeRecovery: async () => { recoveryEntered.open(); await recovery.promise; state = "none"; },
                owner: OWNER,
              });
              let flight: Promise<void> | undefined;
              let released = false;
              try {
                await within(recoveryEntered.promise, "recovery entry");
                const convergence = lifecycle.settled;
                expect(blockNativeMainRecovery(f.homeId, "manual")).toBe(true);
                expect(completeNativeMainRecovery(f.homeId)).toBe(true);
                expect(lifecycle.settled).toBe(convergence);
                flight = lifecycle.release().then(() => { released = true; });
                expect(nativeMainStartupGateSnapshot()).toEqual({ status: "ready", homeId: null });
                expect(nativeMainOwnerSnapshot(f.context)?.status).toBe("held");
                recovery.open();
                await within(sweepEntered.promise, "the post-recovery sweep");
                expect(released).toBe(false);
                expect(nativeMainOwnerSnapshot(f.context)?.status).toBe("held");
                sweep.open();
                await within(flight, "release after the sweep");
                expect(released).toBe(true);
                expect(nativeMainOwnerSnapshot(f.context)).toBeNull();
              } finally {
                recovery.open(); sweep.open();
                await within(flight ?? lifecycle.release(), "final release");
              }
            });
          
          '''
                  replace(cwd,p,marker,marker+test)
                  replace(cwd,'structure/codex-home.md','writ'+'es are ignored.\n','writes are ignored.\n') if False else None
                  p=cwd/'structure/codex-home.md'; text=p.read_text()
                  old='`tests/codex-integration/native-profile-startup-release.test.ts` pins that ordering.'
                  assert old in text
                  p.write_text(text.replace(old,'Recovery-completion provenance is separate from the convergence promise: release retains the owner through the pending recovery and its following stage sweep.\n'+old))
                  msg='fix(codex): preserve convergence drain when recovery publishes ready'
              git(cwd,'diff','--check'); git(cwd,'add','-u'); git(cwd,'commit','-m',msg)
              print('CANDIDATE',n,git(cwd,'rev-parse','HEAD'))
          PY
      - name: Publish isolated candidates only
        id: publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          for n in 6043 6047; do
            repo="$RUNNER_TEMP/lifecycle/$n"
            ref="refs/heads/automation/resume-lifecycle-pr${n}-20260927"
            old="$(git -C "$repo" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote https://github.com/luvs01/opencodex "$ref" | cut -f1)"
            lease="--force-with-lease=$ref:"
            [ -n "$old" ] && lease="--force-with-lease=$ref:$old"
            git -C "$repo" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "$lease" https://github.com/luvs01/opencodex "HEAD:$ref"
          done
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lifecycle'
          rows=[{'pr':str(n),'sha':subprocess.check_output(['git','-C',str(root/str(n)),'rev-parse','HEAD'],text=True).strip()} for n in [6043,6047]]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidates='+json.dumps({'include':rows})+'\n')
          PY
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.candidates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 4
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Focused test and negative control
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" = 6043 ]; then
            file=src/codex/native-profile-startup.ts
            old=c9c936c71d6d3191fec179b7f5fc1598eb816b93
            tests=tests/codex-integration/native-profile-startup-release.test.ts
            pattern='hard-lock-off recovery completion'
          else
            file=src/server/responses/core.ts
            old=1681984ab28eef5261aa16a3fcbbdfe4fa2c72d7
            tests=tests/responses/responses-run-turn-web-search.test.ts
            pattern='non-success sidecar body'
          fi
          bun test "$tests"
          git show "$old:$file" > "$file"
          set +e
          bun test "$tests" --test-name-pattern "$pattern" > "$RUNNER_TEMP/negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/negative.log"
          git restore "$file"
          test "$status" -ne 0
          grep -q '(fail)' "$RUNNER_TEMP/negative.log"
      - run: bun run typecheck
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun test tests/ci-workflows/file-size-ratchet.test.ts
      - run: git diff --exit-code
