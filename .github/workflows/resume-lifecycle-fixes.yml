name: Resumed lifecycle corrections
on:
  push:
    branches: [automation/pr-resume-20260927]
    paths: [.github/workflows/resume-lifecycle-fixes.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidates: ${{ steps.publish.outputs.candidates }}
    steps:
      - name: Run the pinned author-written preparation with the narrowed reference match
        run: |
          python3 - <<'PY'
          import urllib.request, subprocess, yaml
          url='https://raw.githubusercontent.com/luvs01/opencodex/674a501f56f698204ffca364f0778d54117fd3b6/.github/workflows/resume-lifecycle-fixes.yml'
          with urllib.request.urlopen(url,timeout=30) as response: workflow=yaml.safe_load(response.read())
          script=workflow['jobs']['prepare']['steps'][0]['run']
          old=r'\[ADR-\d+\]'
          assert script.count(old)==1
          script=script.replace(old,r'\[ADR-003[1-7]\]')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Publish isolated candidates only
        id: publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          for n in 6043 6047; do
            git -C "$RUNNER_TEMP/lifecycle/$n" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/luvs01/opencodex "HEAD:refs/heads/automation/resume-lifecycle-pr${n}-20260927"
          done
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'lifecycle'
          rows=[{'pr':str(n),'sha':subprocess.check_output(['git','-C',str(root/str(n)),'rev-parse','HEAD'],text=True).strip()} for n in [6043,6047]]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidates='+json.dumps({'include':rows})+'\n')
          PY
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.candidates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 4
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Focused test and negative control
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          if [ "$PR_NUMBER" = 6043 ]; then
            file=src/codex/native-profile-startup.ts
            old=c9c936c71d6d3191fec179b7f5fc1598eb816b93
            tests=tests/codex-integration/native-profile-startup-release.test.ts
            pattern='hard-lock-off recovery completion'
          else
            file=src/server/responses/core.ts
            old=1681984ab28eef5261aa16a3fcbbdfe4fa2c72d7
            tests=tests/responses/responses-run-turn-web-search.test.ts
            pattern='non-success sidecar body'
          fi
          bun test "$tests"
          git show "$old:$file" > "$file"
          set +e
          bun test "$tests" --test-name-pattern "$pattern" > "$RUNNER_TEMP/negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/negative.log"
          git restore "$file"
          test "$status" -ne 0
          grep -q '(fail)' "$RUNNER_TEMP/negative.log"
      - run: bun run typecheck
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun test tests/file-size.test.ts
      - run: git diff --exit-code
