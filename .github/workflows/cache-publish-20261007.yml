name: Publish verified test-cache correction
on:
  push:
    branches: [codex/cache-source-workspace-20261007]
    paths: [.github/workflows/cache-publish-20261007.yml]
permissions:
  contents: read
jobs:
  publish-candidate:
    if: github.repository == 'luvs01/opencodex' && github.ref == 'refs/heads/codex/cache-source-workspace-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      # Apply data only. Do not execute patched code or install dependencies with a write token.
      - name: Reconstruct the checked three-file candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, subprocess
          from pathlib import Path
          repo = 'luvs01/opencodex'
          base = '9099e4bf99166677db0f5fa6df81fe30208dd795'
          expected_tree = '251fa37e3e6fd194ef93328c2e449f8b896891ec'
          branch = 'codex/fix-private-test-transpiler-cache-20261007'
          expected_paths = {'scripts/test.ts', 'structure/ops/cross-platform-ci.md', 'tests/ci-workflows/test-runner.test.ts'}
          if os.environ.get('GITHUB_REPOSITORY') != repo or os.environ.get('GITHUB_REF') != 'refs/heads/codex/cache-source-workspace-20261007':
              raise RuntimeError('unexpected publication target')
          patch = Path('scripts/cache-transport-20261007/fix.patch').read_bytes()
          if len(patch) != 11760 or hashlib.sha256(patch).hexdigest() != 'c7c28efc0a6227b6b061db86f627925e44c19c3826a9d6d767cd62e2879c299d':
              raise RuntimeError('patch checksum mismatch')
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + env['GH_TOKEN']).encode()).decode(),
              GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]',
              GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          def git(*args, data=None):
              result = subprocess.run(['git', *args], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env, check=True)
              return result.stdout.decode().strip()
          if git('remote', 'get-url', 'origin') not in ('https://github.com/' + repo, 'https://github.com/' + repo + '.git'):
              raise RuntimeError('unexpected remote')
          if git('ls-remote', '--heads', 'origin', 'refs/heads/' + branch):
              raise RuntimeError('candidate already exists; refusing overwrite')
          git('fetch', '--no-tags', '--depth=1', 'origin', base)
          git('checkout', '--detach', base)
          git('apply', '--index', '--check', '--whitespace=error-all', '-', data=patch)
          git('apply', '--index', '--whitespace=error-all', '-', data=patch)
          git('diff', '--cached', '--check')
          if set(git('diff', '--cached', '--name-only').splitlines()) != expected_paths:
              raise RuntimeError('unexpected changed-file scope')
          tree = git('write-tree')
          if tree != expected_tree:
              raise RuntimeError('candidate differs from locally checked tree')
          message = ('fix(test): keep the default Bun transpiler cache inside its sandbox\n\n'
              'Preserve nested-child reuse and explicit overrides, but do not adopt the\n'
              'fixed shared temporary cache. Independent environments start cold.\n\n'
              'Linux/Bun 1.4.0: nine new regressions pass; cross-user access is denied.\n'
              'Broader run: 124 pass, 3 skips, 1 environment-dependent wrapper failure.\n'
              'Typecheck, privacy, structure and whitespace checks pass. Native cold-start\n'
              'coverage and independent review remain required; keep draft.\n\n'
              'Fork-only candidate; no merge, release or finding closure.\n')
          commit = git('commit-tree', tree, '-p', base, data=message.encode())
          git('push', 'origin', commit + ':refs/heads/' + branch)
          print('CANDIDATE_COMMIT=' + commit)
          print('VERIFIED_TREE=' + tree)
          PY
