name: PR 4739 baseline comparison for full-suite failures

on:
  push:
    branches: [verify/pr4739-bun-20260916]
    paths: [.github/workflows/pr4739-failure-baseline.yml]

permissions:
  contents: read
  actions: read

# Fork-only diagnostic controls, never merged into the product PR.
# The read-only token is exposed only to the fixed log-download step.
# Failure identities come from the exact published full run, not guessed paths.
jobs:
  compare:
    if: github.repository == 'luvs01/opencodex'
    name: baseline comparison / ${{ matrix.ref.name }} / group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        ref:
          - name: base
            sha: 3070d64d8822c6d8c62989665f82ab665e4d164c
          - name: head
            sha: 469e7ab21689d5cf938ea9cf85ef36f9ff977572
        group: [0, 1]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact product ancestry
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: luvs01/opencodex
          ref: 469e7ab21689d5cf938ea9cf85ef36f9ff977572
          fetch-depth: 2
          persist-credentials: false
      - name: Download the original full-suite log read-only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/luvs01/opencodex/actions/jobs/104636205018/logs \
            --output "$RUNNER_TEMP/pr4739-original-full.log"
      - name: Select pinned ref and isolate homes
        env:
          PRODUCT_SHA: ${{ matrix.ref.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          root="$RUNNER_TEMP/pr4739-comparison"
          mkdir -p "$root/home" "$root/opencodex" "$root/codex" "$root/config" "$root/state"
          printf 'HOME=%s\nUSERPROFILE=%s\nOPENCODEX_HOME=%s\nCODEX_HOME=%s\nXDG_CONFIG_HOME=%s\nXDG_STATE_HOME=%s\n' \
            "$root/home" "$root/home" "$root/opencodex" "$root/codex" "$root/config" "$root/state" >> "$GITHUB_ENV"
      - name: Setup pinned project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Frozen dependencies and dashboard fixtures
        run: |
          set -euo pipefail
          bun --revision
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile && bun run build)
      - name: Derive exact failures and run each selected file once
        env:
          TEST_GROUP: ${{ matrix.group }}
          PRODUCT_SHA: ${{ matrix.ref.sha }}
          PRODUCT_LABEL: ${{ matrix.ref.name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const clean = text => text.replace(/\u001b\[[0-9;]*m/g, '').replace(/^\ufeff/, '').replace(/^\d{4}-\d\d-\d\dT\S+ /gm, '');
          const original = clean(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'pr4739-original-full.log'), 'utf8'));
          const tracked = new Set(cp.execFileSync('git', ['ls-files', 'tests'], {encoding:'utf8'}).trim().split('\n'));
          const failuresByFile = new Map();
          let current = null;
          for (const line of original.split('\n')) {
            const header = line.match(/^(?:##\[group\])?(tests\/[^:\r\n]+\.test\.ts):?\s*$/);
            if (header) { current = tracked.has(header[1]) ? header[1] : null; continue; }
            if (line.startsWith('##[endgroup]')) { current = null; continue; }
            if (current && line.startsWith('(fail) ')) {
              const name = line.slice(7).replace(/\s+\[[^\]]+\]$/, '');
              if (!failuresByFile.has(current)) failuresByFile.set(current, new Set());
              failuresByFile.get(current).add(name);
            }
          }
          const files = [...failuresByFile.keys()].sort();
          console.log('Original full-run failure inventory:');
          for (const file of files) console.log(JSON.stringify({file, failures:[...failuresByFile.get(file)]}));
          if (files.length !== 15) {
            console.log('Original full-run tail for diagnosis:\n' + original.slice(-20000));
            throw new Error(`Expected 15 failing files from the complete run, found ${files.length}; refusing an incomplete comparison`);
          }
          // Both refs must use byte-identical selected tests; only the production patch differs.
          for (const file of files) {
            const blob = ref => cp.execFileSync('git', ['rev-parse', `${ref}:${file}`], {encoding:'utf8'}).trim();
            if (blob('3070d64d8822c6d8c62989665f82ab665e4d164c') !== blob('469e7ab21689d5cf938ea9cf85ef36f9ff977572')) throw new Error(`Changed comparison test: ${file}`);
          }
          const rows = [];
          let bad = false;
          const root = path.join(process.env.RUNNER_TEMP, 'pr4739-case-homes');
          fs.mkdirSync(root, {recursive:true});
          for (const [index, file] of files.entries()) {
            if (index % 2 !== Number(process.env.TEST_GROUP)) continue;
            const home = path.join(root, String(index));
            const env = {...process.env, NO_COLOR:'1'};
            for (const [key, leaf] of Object.entries({HOME:'home', USERPROFILE:'home', OPENCODEX_HOME:'opencodex', CODEX_HOME:'codex', XDG_CONFIG_HOME:'config', XDG_STATE_HOME:'state'})) {
              env[key] = path.join(home, leaf);
              fs.mkdirSync(env[key], {recursive:true});
            }
            const args = ['test', '--timeout', '10000', file];
            // Only the full-run failing shim case is selected: avoid rerunning its many
            // already-passing long process lifecycle cases. The pattern comes from the log.
            const shim = path.basename(file) === 'codex-shim.test.ts';
            if (shim) {
              const escape = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              args.push('-t', [...failuresByFile.get(file)].map(name => escape(name.split(' > ').at(-1))).join('|'));
            }
            console.log(`::group::${process.env.PRODUCT_LABEL} / ${file}`);
            console.log(`Source ${process.env.PRODUCT_SHA}; command: ${JSON.stringify(['bun', ...args])}`);
            const start = Date.now();
            const result = cp.spawnSync('bun', args, {cwd:process.cwd(), env, encoding:'utf8', timeout:330000, maxBuffer:12*1024*1024});
            const output = clean(`${result.stdout ?? ''}\n${result.stderr ?? ''}`);
            fs.writeFileSync(path.join(home, 'test.log'), output);
            const pass = Number((output.match(/^\s*(\d+) pass\s*$/m) || [])[1] ?? -1);
            const fail = Number((output.match(/^\s*(\d+) fail\s*$/m) || [])[1] ?? -1);
            const skip = Number((output.match(/^\s*(\d+) skip\s*$/m) || [])[1] ?? 0);
            const names = [...new Set([...output.matchAll(/^\(fail\) (.+)$/gm)].map(m => m[1].replace(/\s+\[[^\]]+\]$/, '')))];
            console.log(`RESULT ${JSON.stringify({ref:process.env.PRODUCT_LABEL, file, shimFilter:shim, exit:result.status, signal:result.signal, error:result.error?.message, pass, fail, skip, milliseconds:Date.now()-start, failures:names})}`);
            if (result.status !== 0 || result.error || pass + fail <= 0) {
              bad = true;
              const lines = output.split('\n');
              const keep = new Set();
              for (let n=0; n<lines.length; n++) if (/^\(fail\)|error:|Expected:|Received:|timed out|Test timed out/.test(lines[n])) {
                for (let k=Math.max(0,n-14); k<=Math.min(lines.length-1,n+5); k++) keep.add(k);
              }
              console.log([...keep].sort((a,b)=>a-b).map(n=>lines[n]).join('\n').slice(-16000));
            }
            console.log(output.split('\n').slice(-10).join('\n'));
            console.log('::endgroup::');
            rows.push(`| ${file}${shim ? ' (failing case only)' : ''} | ${result.status ?? result.signal ?? 'error'} | ${pass} | ${fail} | ${skip} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## ${process.env.PRODUCT_LABEL} / group ${process.env.TEST_GROUP}\n\nExact product: \`${process.env.PRODUCT_SHA}\`. Every selected test file is byte-identical on base/head. Fresh processes/homes; no test edits or timeout relaxation. File selection comes directly from full-run job 104636205018.\n\n| File | Exit | Pass | Fail | Skip |\n|---|---:|---:|---:|---:|\n${rows.join('\n')}\n\nIsolated comparisons do not replace the failed full parallel run or prove absence of order/load-sensitive regressions.\n`);
          process.exitCode = bad ? 1 : 0;
          NODE
      - name: Confirm tracked product files were not altered
        if: always() && !cancelled()
        run: git diff --exit-code HEAD
