name: Test-cache pinned source workspace
on:
  push:
    branches: [codex/cache-source-workspace-20261007]
    paths: [.github/workflows/cache-source-workspace-20261007.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'luvs01/opencodex' && github.ref == 'refs/heads/codex/cache-source-workspace-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 9099e4bf99166677db0f5fa6df81fe30208dd795
          persist-credentials: false
      - name: Export source without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-source/source"
          git archive 9099e4bf99166677db0f5fa6df81fe30208dd795 | tar -x -C "$RUNNER_TEMP/cache-source/source"
          printf '%s\n' 9099e4bf99166677db0f5fa6df81fe30208dd795 > "$RUNNER_TEMP/cache-source/SOURCE_SHA"
          git rev-parse 9099e4bf99166677db0f5fa6df81fe30208dd795^{tree} > "$RUNNER_TEMP/cache-source/SOURCE_TREE"
          tar -czf "$RUNNER_TEMP/cache-source.tar.gz" -C "$RUNNER_TEMP/cache-source" .
          sha256sum "$RUNNER_TEMP/cache-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-source-9099e4bf
          path: ${{ runner.temp }}/cache-source.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
