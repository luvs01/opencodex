name: PR 5778 exact candidate checks
on:
  push:
    branches: [automation/pr-batch-audit-20260925]
    paths: [.github/workflows/pr5778-final-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: 69ccf5d9f1531eebf087699d47d50be493939fc7
          fetch-depth: 3
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Focused current-failure ownership regressions
        run: bun test tests/server/server-combo-cooldown-recording.test.ts
      - name: Existing combo failover regressions
        run: bun test tests/server/server-combo-failover-e2e.test.ts
      - run: bun run typecheck
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun test tests/test-layout.test.ts tests/test-layout-tooling.test.ts
      - name: Old-core negative control
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore -- src/server/responses/core-combo.ts' EXIT
          git show 1e64a046e87406e4f8f1813a68f58c65d17de52e:src/server/responses/core-combo.ts > src/server/responses/core-combo.ts
          set +e
          bun test tests/server/server-combo-cooldown-recording.test.ts --test-name-pattern 'a stale in-flight' > "$RUNNER_TEMP/negative.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/negative.log"
          test "$status" -eq 1
          grep -q '1 fail' "$RUNNER_TEMP/negative.log"
      - run: git diff --exit-code
