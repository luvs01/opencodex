name: PR 4621 isolated author validation snapshot

# Fork-only scratch tooling, never part of PR #4621.
# Security review: immutable public source, hosted runner, read-only token,
# no secrets, no persisted credentials, no repository or release writes.
on:
  push:
    branches: [agent/pr4621-author-validation-20260917]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'luvs01/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current dev snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: lidge-jun/opencodex
          ref: cfdf5c3795da41ec22bc4b754645f685cdc1d0c6
          persist-credentials: false
      - name: Set up project Bun
        uses: ./.github/actions/setup-project-bun
      - name: Export current root dependencies and runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr4621-current-dev
          bun install --frozen-lockfile --ignore-scripts
          cp "$(command -v bun)" /tmp/pr4621-current-dev/bun
          bun --version > /tmp/pr4621-current-dev/bun-version.txt
          tar -czf /tmp/pr4621-current-dev/root-dependencies.tar.gz node_modules
          cd /tmp/pr4621-current-dev
          sha256sum bun bun-version.txt root-dependencies.tar.gz > SHA256SUMS
      - name: Upload validation runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr4621-current-dev-runtime
          path: /tmp/pr4621-current-dev/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
