name: PR 5780 isolated ownership validation
on:
  push:
    branches: [automation/pr5780-ownership-validation-20260925]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # Only this fixed, isolated Python patch runs with contents write permission.
      # Repository code and tests execute exclusively in the read-only verify jobs.
      - name: Apply reviewed exact-head changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3afce371ebd06634b910782bf903f9876b310c4a || git fetch --depth=2 origin "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 3afce371ebd06634b910782bf903f9876b310c4a
          python3 -I - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, text.count(old))
              p.write_text(text.replace(old, new))
          replace_once('src/codex/catalog/parsing.ts', '''  if (existsSync(backupPath)) {
              // A backup written by an earlier run predates the ownership ledger: adopt it so
              // uninstall can still remove the file we produced. Both call sites pass our own
              // deterministic names — the hashed backup, or the legacy name already claimed by
              // INITIAL_OWNED_PATHS.
              recordOwnedConfigPath(getConfigDir(), backupPath);
              return;
            }''', '''  // An existing name is not evidence of ownership; keep pre-ledger/user backups unclaimed.
            if (existsSync(backupPath)) return;''')
          replace_once('src/codex/internal/catalog-writer.ts', '''  // Record both outcomes: "written" is ours by construction, and "preserved" means the
            // hashed backup already on disk came from an earlier run that predates the ledger.
            if (!io) recordOwnedConfigPath(getConfigDir(), prepared.path);''', '''  // Only a successful new publication proves creation. A preserved pathname proves nothing
            // about its producer; existing ledger entries remain valid without re-adoption.
            if (!io && publication === "written") recordOwnedConfigPath(getConfigDir(), prepared.path);''')
          p = Path('tests/config/config-ownership-uninstall.test.ts')
          text = p.read_text()
          marker = '  test("writePristineCatalogBackup records a hashed backup that already exists", () => {'
          assert text.count(marker) == 1
          tail = text[text.index(marker):]
          assert tail.count('  test(') == 1 and text.endswith('});\n')
          text = text[:text.index(marker)] + '''  for (const existing of ['{"models":[{"slug":"user-owned"}]}\\n', '{"models":[]}\\n']) {
            test(`writePristineCatalogBackup does not adopt an existing regular backup: ${existing.trim()}`, () => {
              const parent = mkdtempSync(join(tmpdir(), "ocx-uninstall-pristine-existing-"));
              const dir = join(parent, "config");
              const catalogPath = join(parent, "models.json");
              const name = "catalog-backup-0123456789abcdef.json";
              const backupPath = join(dir, name);
              const previous = process.env.OPENCODEX_HOME;
              process.env.OPENCODEX_HOME = dir;
              try {
                expect(recordOwnedConfigPath(dir, join(dir, "config.json"))).toBe(true);
                writeFileSync(catalogPath, '{"models":[]}\\n');
                writeFileSync(backupPath, existing);
                const before = manifestPaths(dir);
                writePristineCatalogBackup(backupPath, catalogPath, { models: [] });
                expect(manifestPaths(dir)).toEqual(before);
                expect(manifestPaths(dir)).not.toContain(name);
                const result = removeOwnedConfigState(dir);
                expect(result.status).toBe("partial");
                expect(result.residualPaths).toEqual([backupPath]);
                expect(readFileSync(backupPath, "utf8")).toBe(existing);
              } finally {
                if (previous === undefined) delete process.env.OPENCODEX_HOME;
                else process.env.OPENCODEX_HOME = previous;
                removeTreeWithRetry(parent);
              }
            });
          }

          test("serialized pristine fallback records only the newly written backup", () => {
            const parent = mkdtempSync(join(tmpdir(), "ocx-uninstall-pristine-fallback-"));
            const dir = join(parent, "config");
            const backupPath = join(dir, "catalog-backup-0123456789abcdef.json");
            const previous = process.env.OPENCODEX_HOME;
            process.env.OPENCODEX_HOME = dir;
            try {
              expect(recordOwnedConfigPath(dir, join(dir, "config.json"))).toBe(true);
              writePristineCatalogBackup(backupPath, join(parent, "missing.json"), { models: [] });
              expect(JSON.parse(readFileSync(backupPath, "utf8"))).toEqual({ models: [] });
              expect(manifestPaths(dir)).toContain("catalog-backup-0123456789abcdef.json");
              expect(removeOwnedConfigState(dir).status).toBe("removed");
              expect(existsSync(backupPath)).toBe(false);
            } finally {
              if (previous === undefined) delete process.env.OPENCODEX_HOME;
              else process.env.OPENCODEX_HOME = previous;
              removeTreeWithRetry(parent);
            }
          });

          test("a routed-only catalog creates neither a backup nor an ownership entry", () => {
            const parent = mkdtempSync(join(tmpdir(), "ocx-uninstall-pristine-routed-"));
            const dir = join(parent, "config");
            const name = "catalog-backup-0123456789abcdef.json";
            const backupPath = join(dir, name);
            const previous = process.env.OPENCODEX_HOME;
            process.env.OPENCODEX_HOME = dir;
            try {
              expect(recordOwnedConfigPath(dir, join(dir, "config.json"))).toBe(true);
              const before = manifestPaths(dir);
              writePristineCatalogBackup(backupPath, join(parent, "missing.json"), { models: [{ slug: "provider/model" }] });
              expect(existsSync(backupPath)).toBe(false);
              expect(manifestPaths(dir)).toEqual(before);
              expect(manifestPaths(dir)).not.toContain(name);
            } finally {
              if (previous === undefined) delete process.env.OPENCODEX_HOME;
              else process.env.OPENCODEX_HOME = previous;
              removeTreeWithRetry(parent);
            }
          });

          test("failed pristine copying does not register an unwritten backup", () => {
            const parent = mkdtempSync(join(tmpdir(), "ocx-uninstall-pristine-failure-"));
            const dir = join(parent, "config");
            const catalogPath = join(parent, "models.json");
            const backupPath = join(dir, "missing", "catalog-backup-0123456789abcdef.json");
            const previous = process.env.OPENCODEX_HOME;
            process.env.OPENCODEX_HOME = dir;
            try {
              expect(recordOwnedConfigPath(dir, join(dir, "config.json"))).toBe(true);
              writeFileSync(catalogPath, '{"models":[]}\\n');
              const before = manifestPaths(dir);
              expect(() => writePristineCatalogBackup(backupPath, catalogPath, { models: [] })).toThrow();
              expect(existsSync(backupPath)).toBe(false);
              expect(manifestPaths(dir)).toEqual(before);
            } finally {
              if (previous === undefined) delete process.env.OPENCODEX_HOME;
              else process.env.OPENCODEX_HOME = previous;
              removeTreeWithRetry(parent);
            }
          });

          test("preserving an already recorded pristine backup keeps its original ownership", () => {
            const parent = mkdtempSync(join(tmpdir(), "ocx-uninstall-pristine-owned-"));
            const dir = join(parent, "config");
            const catalogPath = join(parent, "models.json");
            const backupPath = join(dir, "catalog-backup-0123456789abcdef.json");
            const previous = process.env.OPENCODEX_HOME;
            process.env.OPENCODEX_HOME = dir;
            try {
              expect(recordOwnedConfigPath(dir, join(dir, "config.json"))).toBe(true);
              writeFileSync(catalogPath, '{"models":[]}\\n');
              writePristineCatalogBackup(backupPath, catalogPath, { models: [] });
              const before = manifestPaths(dir);
              writePristineCatalogBackup(backupPath, catalogPath, { models: [{ slug: "other" }] });
              expect(manifestPaths(dir)).toEqual(before);
              expect(readFileSync(backupPath, "utf8")).toBe('{"models":[]}\\n');
              expect(removeOwnedConfigState(dir).status).toBe("removed");
              expect(existsSync(backupPath)).toBe(false);
            } finally {
              if (previous === undefined) delete process.env.OPENCODEX_HOME;
              else process.env.OPENCODEX_HOME = previous;
              removeTreeWithRetry(parent);
            }
          });

          test("an existing matching backup directory stays unclaimed after the writer visits it", () => {
            const parent = mkdtempSync(join(tmpdir(), "ocx-uninstall-pristine-directory-"));
            const dir = join(parent, "config");
            const backupPath = join(dir, "catalog-backup-0123456789abcdef.json");
            const previous = process.env.OPENCODEX_HOME;
            process.env.OPENCODEX_HOME = dir;
            try {
              expect(recordOwnedConfigPath(dir, join(dir, "config.json"))).toBe(true);
              mkdirSync(backupPath);
              const nested = join(backupPath, "mine.txt");
              writeFileSync(nested, "keep me\\n");
              const before = manifestPaths(dir);
              writePristineCatalogBackup(backupPath, join(parent, "missing.json"), { models: [] });
              expect(manifestPaths(dir)).toEqual(before);
              expect(removeOwnedConfigState(dir).residualPaths).toEqual([backupPath]);
              expect(readFileSync(nested, "utf8")).toBe("keep me\\n");
            } finally {
              if (previous === undefined) delete process.env.OPENCODEX_HOME;
              else process.env.OPENCODEX_HOME = previous;
              removeTreeWithRetry(parent);
            }
          });
        });
        '''
          # The inserted block uses the same two-space indentation as the original suite.
          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith('  for (const existing of'))
          for i in range(start + 1, len(lines)):
              if lines[i].startswith('        '):
                  lines[i] = lines[i][8:]
          p.write_text('\n'.join(lines).rstrip() + '\n')
          p = Path('tests/codex-integration/codex-catalog-writer.test.ts')
          text = p.read_text()
          marker = 'test("hashed backup publication records a backup it writes itself", () => {'
          assert text.count(marker) == 1
          assert text[text.index(marker):].count('test(') == 2
          text = text[:text.index(marker)] + '''test("new hashed publication is recorded and remains owned when preserved later", () => {
          const name = "catalog-backup-0123456789abcdef.json";
          const path = join(openCodexHome, name);
          expect(recordOwnedConfigPath(openCodexHome, join(openCodexHome, "config.json"))).toBe(true);
          const result = withLivePermit((permit) =>
            publishHashedCodexCatalogBackup(permit, codexHome, { path, content: "pristine\\n" })
          );
          expect(result).toBe("written");
          const before = manifestPaths(openCodexHome);
          expect(before).toContain(name);
          expect(withLivePermit((permit) =>
            publishHashedCodexCatalogBackup(permit, codexHome, { path, content: "later\\n" })
          )).toBe("preserved");
          expect(manifestPaths(openCodexHome)).toEqual(before);
          expect(readFileSync(path, "utf8")).toBe("pristine\\n");
          expect(removeOwnedConfigState(openCodexHome).status).toBe("removed");
          expect(existsSync(path)).toBe(false);
        });

        for (const existing of ["user-owned\\n", "pristine\\n"]) {
          test(`hashed publication does not adopt an existing regular backup: ${existing.trim()}`, () => {
            const name = "catalog-backup-0123456789abcdef.json";
            const path = join(openCodexHome, name);
            expect(recordOwnedConfigPath(openCodexHome, join(openCodexHome, "config.json"))).toBe(true);
            writeFileSync(path, existing, { mode: 0o600 });
            const before = manifestPaths(openCodexHome);
            const result = withLivePermit((permit) =>
              publishHashedCodexCatalogBackup(permit, codexHome, { path, content: "pristine\\n" })
            );
            expect(result).toBe("preserved");
            expect(manifestPaths(openCodexHome)).toEqual(before);
            expect(manifestPaths(openCodexHome)).not.toContain(name);
            const removal = removeOwnedConfigState(openCodexHome);
            expect(removal.status).toBe("partial");
            expect(removal.residualPaths).toEqual([path]);
            expect(readFileSync(path, "utf8")).toBe(existing);
          });
        }

        test("hashed publication does not adopt an existing backup directory", () => {
          const name = "catalog-backup-0123456789abcdef.json";
          const path = join(openCodexHome, name);
          expect(recordOwnedConfigPath(openCodexHome, join(openCodexHome, "config.json"))).toBe(true);
          mkdirSync(path);
          const nested = join(path, "mine.txt");
          writeFileSync(nested, "keep me\\n");
          const before = manifestPaths(openCodexHome);
          expect(withLivePermit((permit) =>
            publishHashedCodexCatalogBackup(permit, codexHome, { path, content: "pristine\\n" })
          )).toBe("preserved");
          expect(manifestPaths(openCodexHome)).toEqual(before);
          const removal = removeOwnedConfigState(openCodexHome);
          expect(removal.status).toBe("partial");
          expect(removal.residualPaths).toEqual([path]);
          expect(readFileSync(nested, "utf8")).toBe("keep me\\n");
        });

        test("failed hashed publication does not record an unwritten backup", () => {
          expect(recordOwnedConfigPath(openCodexHome, join(openCodexHome, "config.json"))).toBe(true);
          const blocked = join(openCodexHome, "blocked-parent");
          writeFileSync(blocked, "not a directory\\n");
          const path = join(blocked, "catalog-backup-0123456789abcdef.json");
          const before = manifestPaths(openCodexHome);
          expect(() => withLivePermit((permit) =>
            publishHashedCodexCatalogBackup(permit, codexHome, { path, content: "pristine\\n" })
          )).toThrow();
          expect(existsSync(path)).toBe(false);
          expect(manifestPaths(openCodexHome)).toEqual(before);
        });
        '''
          lines = text.splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith('test("new hashed publication'))
          for i in range(start + 1, len(lines)):
              if lines[i].startswith('        '):
                  lines[i] = lines[i][8:]
          p.write_text('\n'.join(lines).rstrip() + '\n')
          replace_once('structure/config.md', '''uninstall with their exact paths.

The newly created OAuth''', '''uninstall with their exact paths.

Per-catalog hashed backups are recorded only after a new backup is successfully written by
`src/codex/catalog/parsing.ts` or published by `src/codex/internal/catalog-writer.ts`.
Preserving an existing file does not register it, even if its deterministic name or bytes match.
Previously recorded paths keep their ownership; unrecorded pre-ledger backups remain residuals.
After stopping OpenCodex and completing any needed restore, review and archive those exact residual
paths before manually removing only confirmed obsolete backups. Never infer ownership from a glob.
The legacy fixed-name entries already present in ownership manifests are not migrated by this rule.

The newly created OAuth''')
          replace_once('structure/catalog.md', '''- invalidates `$CODEX_HOME/models_cache.json` when model visibility changes.

Cache invalidation''', '''- invalidates `$CODEX_HOME/models_cache.json` when model visibility changes.

Per-catalog hashed backup cleanup follows the [recorded ownership contract](config.md#restore):
only a new successful write/publication records a path; an existing backup is not adopted by name.

Cache invalidation''')
          Path('.github/workflows/pr5780-ownership-validation.yml').unlink()
          PY
          git diff --check
      - name: Publish candidate only on the isolated branch
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/codex/catalog/parsing.ts src/codex/internal/catalog-writer.ts tests/config/config-ownership-uninstall.test.ts tests/codex-integration/codex-catalog-writer.test.ts structure/config.md structure/catalog.md .github/workflows/pr5780-ownership-validation.yml
          git -c core.hooksPath=/dev/null commit -m 'fix(uninstall): never adopt preserved catalog backups'
          git -c core.hooksPath=/dev/null -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/automation/pr5780-ownership-validation-20260925
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Resolve project Bun
        id: bun
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').dependencies.bun + '\n')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Native ownership and catalog writer regressions
        run: bun test tests/config/config-ownership-uninstall.test.ts tests/codex-integration/codex-catalog-writer.test.ts
      - name: Prove the new preservation tests reject the reviewed bug
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          trap 'git restore -- src/codex/catalog/parsing.ts src/codex/internal/catalog-writer.ts' EXIT
          git show 3afce371ebd06634b910782bf903f9876b310c4a:src/codex/catalog/parsing.ts > src/codex/catalog/parsing.ts
          git show 3afce371ebd06634b910782bf903f9876b310c4a:src/codex/internal/catalog-writer.ts > src/codex/internal/catalog-writer.ts
          set +e
          bun test tests/config/config-ownership-uninstall.test.ts tests/codex-integration/codex-catalog-writer.test.ts --test-name-pattern 'does not adopt an existing regular backup' > "$RUNNER_TEMP/pr5780-negative-control.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/pr5780-negative-control.log"
          test "$status" -eq 1
          grep -Eq '4 fail' "$RUNNER_TEMP/pr5780-negative-control.log"
      - name: Project typecheck
        if: runner.os == 'Linux'
        run: bun run typecheck
      - name: Privacy scan
        if: runner.os == 'Linux'
        run: bun run privacy:scan
      - name: Structure check
        if: runner.os == 'Linux'
        run: bun run structure:check
      - name: Verify source and whitespace stayed clean
        run: git diff --exit-code
